# ============================================================
# 小说管理系统 · 认证服务（novel-auth）主配置
# ============================================================
# 这里只放【所有环境都一样】的配置。
# 数据库地址、Redis 密码这类会变的，全部放 application-dev.yml。
#
# ★★ 这个文件是 M1 从 novel-backend 的 application.yml 抄过来的，
#    抄的时候【故意保持逐项一致】—— 两个服务对外是同一个 API 风格，
#    JSON 约定、时间格式、错误结构只要有一处不同，前端就得写两套解析，
#    而这种不一致不会报错，只会表现为「这个接口的字段跟那个不一样」。
#
#    ★ 所以下面标了「★ 镜像」的段落，两边的值必须同时改。
#      grep 一下就知道有几处：grep -n "★ 镜像" backend/novel-*/src/main/resources/application.yml
# ============================================================

server:
  # ★ 8081 —— 网关 :8080 是唯一入口，这个端口只在开发期直连排错时用。
  #   生产环境它不对外（docs/部署.md：Nginx 只暴露网关）。
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      force: true      # 强制请求和响应都用 UTF-8，否则中文会乱码

spring:
  application:
    name: novel-auth

  profiles:
    active: dev        # ★ 默认用 dev（连你虚拟机上的 MySQL/Redis）

  # ★ 镜像（novel-backend 的 application.yml 同款）
  jackson:
    # ⚠️ 这里【故意不写】date-format —— 它只对 java.util.Date 有效，
    #    对项目里用的 LocalDateTime 完全不生效（且不报错不警告）。
    #    真正生效的是 com.novel.common.config.JacksonConfig（M1 起在 novel-common）。
    time-zone: GMT+8
    default-property-inclusion: non_null   # 值为 null 的字段直接不返回，前端少判断
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false

  # 上传头像要用（ReaderProfileController 的 POST /api/reader/profile/avatar）
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# ============================================================
# JWT
# ============================================================
novel:
  jwt:
    # ★★★ 和 novel-backend 一样：【故意不给默认值】★★★
    #     生产环境没配 JWT_SECRET 就直接起不来，一眼看出是密钥没配。
    #
    # ★★ M1 起这个键【有三个地方在用】，而且必须是同一个值：
    #      novel-auth     —— 签 token（登录）
    #      novel-backend  —— 通过 novel-common 的 JwtUtil 读它（虽然目前不验签，
    #                        但 M2/M3 的方法级鉴权会用到）
    #      novel-gateway  —— 验 token（每个请求都验）
    #    三边不一致的症状是「登录成功但所有接口都 401」—— 看起来像网关没转发。
    #    开发环境的默认值在各自的 application-dev.yml 里。
    secret: ${JWT_SECRET}

    # token 有效期（天）。★ 三处必须一致（同上）—— 网关拿它算出 JwtUtil 实例，
    # 虽然网关不签发，但 JwtUtil 的构造器要求这个键存在。
    expire-days: 7

  # ============================================================
  # 内部令牌（M1）
  # ============================================================
  internal:
    # ★★★ 和 jwt.secret 同一个写法：【故意不给默认值】★★★
    #     生产没配 INTERNAL_TOKEN 就起不来，而不是静默用一个公开的弱密钥。
    #     完整理由写在 novel-backend/application.yml 的同一个键上。
    #
    # ★★ 这个键在本服务有两处地址相反的使用，都要它：
    #      进 —— HeaderAuthenticationFilter（验别人打进来的请求）
    #      出 —— FeignIdentityConfig（给自己发出去的调用加这个头）
    token: ${INTERNAL_TOKEN}

# ============================================================
# MyBatis-Plus
# ============================================================
# ★ 镜像（novel-backend 同款）—— 这两个服务读写的是【同一个 novel 库】，
#   逻辑删除、主键策略、驼峰映射必须完全一致，否则同一个表在两个服务里
#   行为不同（比如一边查出已删除的行），而且不报错。
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.novel.modules.**.entity

  configuration:
    map-underscore-to-camel-case: true          # create_time → createTime
    cache-enabled: false                        # 关掉二级缓存，避免多实例/集群下数据不一致
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

  global-config:
    banner: false
    db-config:
      id-type: auto                             # 主键自增
      logic-delete-field: deleted               # ★ 逻辑删除字段
      logic-delete-value: 1
      logic-not-delete-value: 0

# ============================================================
# Knife4j 接口文档
# ============================================================
# ★ M1 起文档有两个入口：:8081/doc.html（本服务）、:8090/doc.html（novel-backend）
knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-footer: false
    enable-open-api: false

# ============================================================
# 日志
# ============================================================
# ★ 镜像（novel-backend 同款）
logging:
  level:
    root: info
    com.novel: debug
    org.springframework.web: info
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
