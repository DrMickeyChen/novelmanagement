# ============================================================
# 开发环境配置 —— 认证服务（novel-auth）
# ============================================================
# ★★★ 这个文件里的 IP 要改成你自己的虚拟机 IP ★★★
#
# 怎么查：在虚拟机上执行
#     hostname -I
#   取输出的第一个 IP（形如 192.168.127.137）
#
# 本文件里【三处】192.168.127.137 都要换成它（就是下面这三个键的值，
# 别去数行数 —— 上面那句 "形如 192.168.127.137" 是举例，不用改）：
#   ① spring.datasource.url
#   ② spring.data.redis.host
#   ③ spring.cloud.nacos.discovery.server-addr
#
# ★ 这三个值和 novel-content / novel-interaction 的 application-dev.yml 里【完全一样】：
#   三个服务连的是同一台虚拟机的同一套中间件、同一个 novel 库
#   （M1 的决定：先共用一个库，不拆库）。改 IP 时三个文件都要改。
# ============================================================

spring:

  # ---------------- MySQL ----------------
  # ★ 和 novel-content / novel-interaction 指向【同一个 novel 库】——
  #   M1 不拆库。所以 sys_user / sys_role / author_apply 这些表
  #   由本服务独占读写，novel-content / novel-interaction 只能通过 /internal/** 接口来问，
  #   不能再直连这些表（那一层由 M1 的 Feign 接缝保证）。
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.127.137:3306/novel?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&allowMultiQueries=true
    username: root
    password: root123456

    hikari:
      # ★★ pool-name 必须和 novel-content / novel-interaction 都不同！
      #    三个都叫 NovelHikariPool 的话，看 Hikari 的调试日志、看线程 dump
      #    时分不清是哪个服务在占连接 —— 而这三个服务连的是同一个 MySQL，
      #    连接数是要合起来算的（各自 maximum-pool-size 20，加起来 60）。
      pool-name: NovelAuthHikariPool
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 600000
      max-lifetime: 1800000        # ★ 必须小于 MySQL 的 wait_timeout
      connection-timeout: 10000
      connection-test-query: SELECT 1

  # ---------------- Redis ----------------
  # ★ Spring Boot 3 里路径是 spring.data.redis，不是 spring.redis
  #   （老教程写的 spring.redis 会被静默忽略，连接直接走默认的 localhost）
  #
  # ★★ M1 起 Redis 里的内容是【四个进程共享】的：
  #     novel-auth   写登录态（novel:auth:token:{userId}:{jti}）
  #     novel-gateway 每请求读一次登录态 —— 它靠这个判断「token 还有效吗」
  #     novel-content / novel-interaction 不读登录态（它们的身份来自网关的请求头）
  #    四边必须用到【同一个 database】，否则网关查不到 auth 写的 key，
  #    症状是全站 401 —— 看起来像网关坏了。
  data:
    redis:
      host: 192.168.127.137
      port: 6379
      password: redis123456
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms

  # ---------------- Nacos 注册中心 ----------------
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.127.137:8848

        # ★★ username / password 必须写在 discovery 下面，这两行不能省。
        #    Nacos 客户端【注册】和【拉配置】是两条独立的鉴权路径，
        #    只配了后者的话症状是「配置能拉、服务注册不上」—— 报 403 或客户端假死，
        #    而且报错信息里完全看不到配置项的事（同 novel-interaction 的详细注释）。
        username: nacos
        password: nacos

        # ★★ 这一行在 Windows 上【必须写】。
        #    Nacos 客户端默认取「第一块非 loopback 网卡」的地址，
        #    装了 VMware / VirtualBox / Hyper-V / WSL 之后那个「第一块」
        #    很可能是 192.168.56.1 这类虚拟网卡 —— 网关根本连不上它。
        #    症状：Nacos 上实例数正常，但 :8080/api/auth/login 返回 503，
        #    日志是「Unable to find instance for novel-auth」，看起来像路由配错了。
        ip: 127.0.0.1

    # ---------------- Feign 超时：★ M3 起本服务没有这一节了 ----------------
    # 这里原来有一段 openfeign.client.config.default（connect 2000 / read 3000），
    # 唯一的用途是给「审完 → 等 novel-content 写审核流水」那次同步调用设超时，
    # 读超时还特意比 content 那份短（3000 vs 5000），因为管理员正盯着按钮等。
    #
    # ★★ M3 把那条边换成了事务消息（AuthorApplyAuditProducer），
    #    于是 openfeign 的依赖、配置、@EnableFeignClients、【整段一起】删掉了。
    #    留着这一节比删掉更糟：Spring Boot 对未知前缀不报错，
    #    它会安安静静地生效于「一个不存在的 Feign 客户端」——
    #    下一个人看见这段会以为本服务还在往外调，而去 novel-content 里找一个不存在的接口。
    #
    # ★ 要复核的话，别 grep 关键词 —— 判据钉在「有没有这条边」上：
    #       ls backend/novel-auth/src/main/java/com/novel/auth/client/   → 目录不存在
    #       mvn -f backend/pom.xml -pl novel-auth -am dependency:tree \
    #         | sed -n '/com.novel:novel-auth:jar/,$p' | grep -iE "feign|loadbalancer"  → 0
    #   （阳性对照：换成 -pl novel-interaction 是 8 命中 —— 那条管道会失败。）
    #   ★★ M3 订正：这里原来写的是
    #       grep -rn "openfeign\|feign" backend/novel-auth/src/main/resources/
    #   「必须是 0 命中」——而它实测 3 命中，全在注释里（含这一行自己）。
    #   凡是「讲这里以前有什么」的注释都必然写着那个词，
    #   于是这条判据永远失败、且失败得毫无信息量，最后被当成噪音忽略。
    #
    # ★ 审核接口现在的超时语义完全变了，值得记一笔：
    #    改造前 = 「管理员等 content 写流水」（同步，最坏 3 秒后报错）
    #    改造后 = 「等 Broker 收下半消息」（一次网络往返，然后立刻返回）
    #    流水本身在事务提交后才可见，管理员不等它 —— 也【不该】等它。

# ---------------- 文件上传路径 ----------------
# ★★ 这个值【必须和 novel-content / novel-interaction 的完全一样】。
#
#    为什么：头像是【本服务】写的（POST /api/reader/profile/avatar），
#    但 /uploads/** 是【novel-interaction】在服（网关把那条路由指给了它）。
#    三个服务读同一个目录，头像才显示得出来。
#
#    ★ 开发期三者跑在同一台 Windows 上，所以靠「同一条绝对路径」成立。
#      生产上三个容器各有自己的文件系统 —— 那时头像会被写进 auth 的盘、
#      由 interaction 去找，结果 404。这是 M1 明确接受的债，
#      解法在 M5（接 MinIO/OSS），见 docs/M1-摘出auth.md。
novel:
  upload:
    path: ${user.home}/novel-uploads/
    url-prefix: /uploads/

  # ---------------- JWT ----------------
  jwt:
    # 开发环境的默认密钥（和 novel-content、novel-interaction、novel-gateway 四处同款）。
    # ★ 长度必须 ≥ 32 字节，否则 JwtUtil 构造时直接抛异常并说明原因。
    # ★ 这个值只用于本地开发，明文写在提交到 git 的文件里；生产靠环境变量覆盖。
    #
    # ★★ M2 起这个密钥有【四个】使用者，而它们的分工是：
    #      novel-auth     【签】token（登录时）—— 所以它需要 secret
    #      novel-gateway  【验】token（每个请求）—— 所以它也需要 secret
    #      novel-content / novel-interaction  两边都不用（它们的身份来自请求头）
    #    content / interaction 那两份配置是 M1 之后【多余的】——
    #    留着是因为 JwtUtil 在 novel-common 里带 @Component，
    #    只要它在 classpath 上就会被实例化，而它的构造器要求这个配置项。
    #    ★ 四处值不一致的症状很有迷惑性：登录成功、拿得到 token，
    #      但下一个请求就 401 —— 看起来像「登录态没存住」，
    #      于是会去查 Redis、查 cookie，唯独不像密钥。
    #      排错时先 grep：
    #        grep -rn "jwt" backend/*/src/main/resources/application*.yml
    secret: ${JWT_SECRET:novel-dev-only-jwt-secret-please-change-in-production-2026}

  # ---------------- 内部令牌（M1 新增） ----------------
  #
  # ★★ 值必须和 novel-content / novel-interaction / novel-gateway 的【完全一致】。
  #    完整说明（它防什么、为什么不能用默认值、剩余边界是什么）
  #    写在 novel-interaction/application-dev.yml 的同一个键上，这里不重复。
  #
  # ★ 本服务的用法有两处，方向相反：
  #     ① 【进】HeaderAuthenticationFilter 拿它验网关/兄弟服务打进来的请求
  #     ② 【出】FeignIdentityConfig 把它加到自己发出去的调用上
  #    ② 尤其容易漏：漏了的话，审作者申请会在「写审核流水」那一步
  #    被对端 403 —— 而申请本身已经审完了，是【审完了但记不上账】，
  #    数据看着是对的就没人会发现。
  internal:
    token: ${INTERNAL_TOKEN:novel-dev-only-internal-token-please-change-in-production-2026}

# ---------------- RocketMQ（M3 新增） ----------------
#
# ★★ 顶层键，不在 spring: 下面（前缀是 rocketmq）。写成 spring.rocketmq.* 会被
#    静默忽略、退回 localhost:9876 —— 完整说明见 novel-content 的 application-dev.yml，
#    这里只记本服务【特有】的部分。
#
# ★ name-server 必须和 content / interaction 逐字相同（同一个 broker）。
rocketmq:
  name-server: 192.168.127.137:9876

  # ★★ 本服务的生产者组【和另外两个不一样】，这不是随手写的：
  #
  #    auth 发的是【事务消息】（审核流水，用来断掉 auth ⇄ content 那个环）。
  #    事务消息的半消息挂在生产者组下，Broker 回查时按
  #    (生产者组, 事务 id) 找回对应的 TransactionListener 来裁决。
  #
  #    ★ 所以「一组实例 = 一个事务身份」。如果和 content 共用 novel-producer，
  #      两边的半消息就混在同一个组里，回查语义会被搅在一起 ——
  #      而且症状是「回查偶尔找不到对应的事务」，很难查。
  #      MqConstant.PRODUCER_GROUP_AUTH_TX 就是这个值。
  producer:
    group: novel-tx-audit

  # ★★ 这里【不需要】任何一行「开启事务」的配置 —— 已对着 2.3.6 的字节码核过：
  #      RocketMQUtil.createDefaultMQProducer(...) 的两个分支（带 ACL / 不带）
  #      拿到的都是 new TransactionMQProducer(...)。
  #    也就是说 rocketMQTemplate 背后【本来就是】一个事务生产者，
  #    只要存在一个 @RocketMQTransactionListener bean，事务消息就能发。
  #    RocketMQTransactionConfiguration 在启动时会把那个 listener 注册到
  #    template 的 producer 上，成功时打一行
  #    「RocketMQLocalTransactionListener {} register to {} success」——
  #    ★ 这行日志是排查事务消息时【第一个】该 grep 的东西（grep 不到就说明
  #      listener 没注册上，半消息会永远悬着、消费者永远看不到）。
  #    ★ 它注册失败时抛的错也要认：producer 不是 TransactionMQProducer 时
  #      抛 "xxx is not instance of TransactionMQProducer"，
  #      同一模板上挂两个 listener 时抛 "already exists RocketMQLocalTransactionListener"。
  #
  # ★★ 绑定方式是【模板 bean 名】，不是 txProducerGroup：
  #    @RocketMQTransactionListener 的属性只有 corePoolSize / maximumPoolSize /
  #    keepAliveTime / keepAliveTimeUnit / blockingQueueSize / rocketMQTemplateBeanName
  #    ——【没有 txProducerGroup 这个属性】，写了编译不过。
  #    默认 bean 名就是 "rocketMQTemplate"，本服务用它，不用配。
  #
  # ★ 同样【没有】rocketmq.consumer.* 段（max-reconsume-times 那个属性不存在，
  #   写了会被静默忽略；重试次数只能写在注解上）。见 content 那份的注释。

# ---------------- 接口文档显示开关 ----------------
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# ---------------- 日志 ----------------
logging:
  level:
    com.novel: debug
    com.novel.modules: debug
    org.springframework.jdbc: debug

  # ★★ 文件名必须是 novel-auth.log，【不能】也叫 novel-interaction.log。
  #
  #    四个服务的工作目录都是 backend/（见 CLAUDE.md 里那条：
  #    -WorkingDirectory 必须是 backend/，因为 logs/ 是相对路径）。
  #    如果两边都写 logs/novel-interaction.log，就是【两个进程轮流写同一个文件】——
  #    Windows 上文件被占用时第二个进程会写不进去，而且日志会互相穿插，
  #    排错时看到的「刚才那次请求」根本不知道是哪个服务打的。
  file:
    name: logs/novel-auth.log

  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
