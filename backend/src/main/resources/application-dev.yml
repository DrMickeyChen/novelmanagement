# ============================================================
# 开发环境配置
# ============================================================
# ★★★ 这个文件里的 IP 要改成你自己的虚拟机 IP ★★★
#
# 怎么查：在虚拟机上执行
#     hostname -I
#   取输出的第一个 IP（形如 192.168.127.137）
#
# 本文件里【两处】192.168.127.137 都要换成它（就是下面这两个键的值，
# 别去数行数 —— 上面第 8 行那句 "形如 192.168.127.137" 是举例，不用改）：
#   ① spring.datasource.url
#   ② spring.data.redis.host
#
# 为什么不用 localhost：后端跑在你的 Windows 上，
# MySQL/Redis 跑在虚拟机的 Docker 里，是两个不同的机器。
# localhost 指的是 Windows 本机，那里没有 MySQL。
# ============================================================

spring:

  # ---------------- MySQL ----------------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.127.137:3306/novel?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&allowMultiQueries=true
    username: root
    password: root123456

    # HikariCP 连接池（Spring Boot 默认，不用额外引依赖）
    hikari:
      pool-name: NovelHikariPool
      minimum-idle: 5              # 最少保持 5 个空闲连接
      maximum-pool-size: 20        # 最多 20 个连接
      idle-timeout: 600000         # 空闲连接超过 10 分钟回收
      max-lifetime: 1800000        # ★ 连接最长活 30 分钟，必须小于 MySQL 的 wait_timeout
      connection-timeout: 10000    # 拿不到连接时最多等 10 秒就报错，别无限等
      connection-test-query: SELECT 1

  # ---------------- Redis ----------------
  # ★ Spring Boot 3 里路径是 spring.data.redis，不是 spring.redis
  #   （老教程里写的 spring.redis 在 Boot 3 下会被静默忽略，连接直接走默认的 localhost）
  data:
    redis:
      host: 192.168.127.137
      port: 6379
      password: redis123456
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16           # 最多 16 个连接
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms

# ---------------- 文件上传路径 ----------------
# 作品封面、用户头像存这里。开发期先存本地磁盘，
# 第二期接入对象存储（MinIO / OSS）时只改这一个配置项
novel:
  upload:
    path: ${user.home}/novel-uploads/
    url-prefix: /uploads/

  # ---------------- JWT ----------------
  jwt:
    # 开发环境的默认密钥。这样 clone 下来不配任何环境变量就能直接跑。
    #
    # ★ 两点必须知道：
    #   1. 长度必须 ≥ 32 字节。jjwt 用 HMAC-SHA256 签名，密钥短于 256 bit
    #      会直接抛 WeakKeyException（HMAC 的密钥越短越容易被暴力破解，
    #      所以它主动拒绝）。这一串是 54 个字符，绰绰有余。
    #   2. 这个值【只用于本地开发】，明文写在提交到 git 的文件里。
    #      生产环境靠环境变量 JWT_SECRET 覆盖它（见 application.yml）。
    secret: ${JWT_SECRET:novel-dev-only-jwt-secret-please-change-in-production-2026}

# ---------------- 接口文档显示开关 ----------------
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# ---------------- 日志：开发期看详细 SQL ----------------
logging:
  level:
    com.novel: debug
    com.novel.modules: debug
    org.springframework.jdbc: debug

  # ---------------- 同时写一份文件到 backend/logs/ ----------------
  #
  # ★ 为什么写文件：开发期后端是通过
  #     Start-Process java -jar target/novel-backend.jar -WorkingDirectory backend
  #   起的（隐藏窗口），控制台看不到；而且排障时经常需要回头翻
  #   「刚才那次请求到底报了什么」，翻不了滚动的窗口就抓瞎。
  #
  # ★ 路径为什么可以写成相对路径：启动命令里 jar 本身就写成
  #   `target/novel-backend.jar`（相对路径），所以工作目录必然是
  #   backend/ 这一个；`logs/` 也就必然落到 backend/logs/。
  #   用 `${user.dir}` 或绝对路径反而不必 —— 那会让这份配置换台机器就失效。
  #
  # ★ 放在 dev 而不是 application.yml：生产是跑在容器里的，
  #   日志应该走 stdout 交给采集器，落文件反而会在容器里堆着。
  #
  # ★ .gitignore 里已有 `logs/` 和 `*.log`，不会误提交。
  file:
    name: logs/novel-backend.log

  # 控制台只显示到毫秒，翻历史的时候分不清是哪天 —— 文件里带上完整日期
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

  # ★ 一定要封顶：这个后端常年开着不重启，没有滚动策略的话
  #   一个 debug 级别的日志文件能长到几个 G（SQL 全在打）。
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
