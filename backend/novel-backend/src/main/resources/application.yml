# ============================================================
# 小说管理系统 · 主配置
# ============================================================
# 这里只放【所有环境都一样】的配置。
# 数据库地址、Redis 密码这类会变的，全部放 application-dev.yml。
#
# 启动时用 --spring.profiles.active=dev 或 IDE 里配 active profile 切换。
# ============================================================

server:
  # ★★ 第二期 M0 起，8080 归【网关】，单体退到 8090。
  #
  #    为什么是「换端口」而不是「网关另开一个端口」：
  #    dev-proxy/vite.config.js 和三个前端的 request.js 里写的都是 8080，
  #    而那 12 个文件是 md5 锁定的、一个字节都不能改。
  #    把网关放在 8080，它们【一行都不用动】—— 因为 8080 上确实还有东西在接。
  #
  #    ★ 单体从此【不直接对外】。浏览器 :3000 → dev-proxy → :8080 网关
  #      → lb://novel-backend → 这里（:8090）。开发期要直连单体是可以的
  #      （比如排错时绕过网关），但正常入口只有 :3000 一个。
  port: 8090
  servlet:
    encoding:
      charset: UTF-8
      force: true      # 强制请求和响应都用 UTF-8，否则中文会乱码

spring:
  application:
    name: novel-backend

  profiles:
    active: dev        # ★ 默认用 dev（连你虚拟机上的 MySQL/Redis）

  jackson:
    # ⚠️ 这里【故意不写】date-format。
    #
    # 很多人会写 date-format: yyyy-MM-dd HH:mm:ss，然后发现完全没生效 ——
    # 时间依然输出成 "2026-09-19T23:56:13.2551421"。
    # 因为它【只对 java.util.Date 有效】，而项目里用的是 java.time.LocalDateTime，
    # 走的是 Jackson 的 JavaTimeModule，根本不看这一项。而且不报错、不警告。
    #
    # 真正生效的配置在 com.novel.common.config.JacksonConfig（给 LocalDateTime
    # 这个类型注册了序列化器）。那边改一处，全项目的时间格式都跟着变。
    #
    # ★★ M1 提醒：下面三行是【手抄的】，和 novel-auth 的 application.yml 里
    #    那三行必须逐字一致。JacksonConfig 管的是「LocalDateTime 怎么序列化」，
    #    而「null 要不要返回」「时区是什么」只有 yml 能配，它没有代码形态。
    #    ★ 漏改一边的症状：同一个字段在这个接口有、在那个接口没有，
    #      前端得写两套解析 —— 不报错，只是「怪怪的」。
    #    找齐两处：grep -n "★ 镜像" backend/novel-*/src/main/resources/application.yml
    time-zone: GMT+8
    default-property-inclusion: non_null   # 值为 null 的字段直接不返回，前端少判断
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false

  servlet:
    multipart:
      max-file-size: 10MB      # 单个文件上限（封面图、用户头像）
      max-request-size: 20MB   # 单次请求上限

  # 【关于 404 处理】不需要在这里配任何东西。
  #
  # 网上老教程会说：要加
  #     throw-exception-if-no-handler-found: true
  #     web.resources.add-mappings: false
  # 才能让 404 走统一响应体 —— 那是 Spring Boot 3.2 之前的做法。
  #
  # ★ 而且 add-mappings: false 会把【静态资源映射整个关掉】，
  #   而 Knife4j 的 /doc.html 正是靠静态资源映射提供的，结果文档页直接 404。
  #
  # Spring Boot 3.2 起，访问不存在的路径会抛 NoResourceFoundException，
  # 在 GlobalExceptionHandler 里接住它即可，不用动任何配置。

# ============================================================
# JWT
# ============================================================
novel:
  jwt:
    # ★★★ 这里【故意不给默认值】★★★
    #
    # 写 ${JWT_SECRET} 而不是 ${JWT_SECRET:某个默认密钥}，是为了让生产环境
    # 【没配就起不来】—— 直接抛占位符解析失败，一眼能看出是密钥没配。
    #
    # 如果给了默认值，生产环境忘了配密钥时会静默用这个默认值启动，
    # 而这个默认值就写在提交到 git 的文件里 —— 等于全世界都知道你的签名密钥，
    # 任何人都能自己签发一个「我是 admin」的 token。这种事故不会报错，
    # 只会安安静静地被攻破。
    #
    # 开发环境的默认值放在 application-dev.yml（那个只用于本地虚拟机）。
    secret: ${JWT_SECRET}

    # token 有效期（天）。7 天是因为 P1 还没有 refresh token，
    # 时间短了用户就得反复登录。等做了刷新机制再调短。
    expire-days: 7

  # ============================================================
  # 内部令牌（M1）
  # ============================================================
  internal:
    # ★★★ 和上面 jwt.secret 同一个写法：【故意不给默认值】★★★
    #
    # 它是网关到下游、以及服务与服务之间的共享密钥，防的是
    # 「绕开网关直连 :8090 / :8081，自己伪造 X-User-Id: 1 + X-Roles: ADMIN
    #   把自己变成管理员」（决策 4）。
    #
    # ★ 为什么不能给默认值：和 jwt.secret 一模一样的道理 ——
    #   给了默认值，生产环境忘配时会静默用一个【写在 git 里、全世界都知道】
    #   的字符串当密钥。而那等于这道闸不存在，且没有任何症状。
    #   ★ 更糟的是这个值比 jwt.secret 更少被想起来：它不是「登录」的一部分，
    #     平时完全无感，只有在有人真的直连端口时才有区别。
    #
    # 开发环境的默认值放在 application-dev.yml。
    token: ${INTERNAL_TOKEN}

  # ============================================================
  # AI 写作助手（P4）
  # ============================================================
  ai:
    # ★★ 当前使用哪个实现 —— 这一行决定 AI 面板背后是假数据还是真模型。
    #
    #   mock     → MockAiStreamSource（本地生成演示内容，不调用任何外部服务）
    #   deepseek → DeepSeekAiStreamSource（E1 才有这个类）
    #
    # ★ 默认 mock 是刻意的：新克隆下来的仓库不配任何东西就能跑起来，
    #   能立刻看到流式效果。如果默认是真实实现，没配 API Key 的人
    #   一用就报错，而那个错误对「只是想跑起来看看」的人毫无意义。
    #
    # ★★ 但配成 mock 时，界面上【必须】有「演示模式」标识 ——
    #   见 AiQuotaVO.provider：那个标签是后端驱动的，不是前端写死的，
    #   所以改成 deepseek 之后它会自动消失。
    provider: mock

    # 每个账号每天的调用次数上限。
    # ★ P4 是一个固定值，不随调用递减；真正的每日配额是 Redis 计数器
    #   + 次日自动过期（属于 E1，和 api_key 一起做）。
    daily-quota: 50

    # 演示模式下每个字符之间的间隔（毫秒）—— 「打字机效果」的来源。
    # ★ 这个值调大调小只影响观感，不影响任何逻辑。
    #   接真实模型后这一项完全无用（节奏由模型决定）。
    mock-delay-ms: 15

# ============================================================
# MyBatis-Plus
# ============================================================
mybatis-plus:
  # XML 映射文件位置。复杂的多表关联查询写 XML，简单 CRUD 直接用 BaseMapper
  mapper-locations: classpath*:/mapper/**/*.xml

  # 实体类包，写 XML 的 resultType 时可以省略全限定名
  type-aliases-package: com.novel.modules.**.entity

  configuration:
    map-underscore-to-camel-case: true          # create_time → createTime
    cache-enabled: false                        # 关掉二级缓存，避免多实例/集群下数据不一致
    # ★ 开发期把 SQL 打到控制台，方便对账。上线前要注释掉，否则日志会很大
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

  global-config:
    banner: false                               # 关掉启动时那行 MyBatis-Plus 广告
    db-config:
      id-type: auto                             # 主键自增（对应建表语句的 AUTO_INCREMENT）
      logic-delete-field: deleted               # ★ 逻辑删除字段
      logic-delete-value: 1                     # 删除 = 置 1
      logic-not-delete-value: 0                 # 未删除 = 0
      # 逻辑删除后，MyBatis-Plus 会自动给所有查询加上 WHERE deleted = 0
      # 所以你永远不用手写这个条件，也永远不会真的 DELETE 数据

# ============================================================
# Knife4j 接口文档
# ============================================================
knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-footer: false
    enable-open-api: false
  # ★ 生产环境要关掉：springdoc.api-docs.enabled=false

# ============================================================
# 日志
# ============================================================
logging:
  level:
    root: info
    com.novel: debug                    # 自己写的代码开 debug，方便排查
    org.springframework.web: info
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
