# ============================================================
# 小说管理系统 · 搜索服务 · 开发环境配置
# ============================================================
# ★★ 这个文件和 novel-content / novel-interaction 的 application-dev.yml
#    是【手抄】关系。本文件里凡是标了 "★★ 镜像" 的段落，
#    三个服务之间必须逐字一致。
#
# ★★ 中间件地址为什么都是 192.168.127.137：
#    后端跑在你的 Windows 上，而 MySQL / Redis / Nacos / RocketMQ /
#    ★ Elasticsearch 全都跑在【虚拟机】的 Docker 里。
#    所以这里【没有一处】是 localhost —— 写 localhost 会连到 Windows 本机，
#    而那里什么都没有。
#    ★★ 唯一的例外是 spring.cloud.nacos.discovery.ip: 127.0.0.1，
#       那一行指的是【本服务注册到 Nacos 上的地址】，不是它要连的地址。
#       两者长得像但意思完全相反，见下面那一段的注释。
#
# ★★ 本服务【没有 spring.datasource，也没有 mybatis-plus】——
#    它是全项目唯一不连数据库的服务。不是漏了，见 SearchApplication 的类注释。
# ============================================================

spring:

  # ---------------- Elasticsearch（★ M4 的核心，本服务的主存储） ----------------
  #
  # ★★ 地址是【虚拟机】的 9200，不是 localhost。
  #    容器定义在 docs/docker/docker-compose.yml，端口映射 9200:9200。
  #    ★ 排错时先确认三件事（顺序不能反）：
  #      ① 容器在跑      sudo docker ps | grep novel-es        → Up (healthy)
  #      ② 健康是绿的    curl 192.168.127.137:9200/_cluster/health  → "status":"green"
  #      ③ IK 装上了     curl 192.168.127.137:9200/_cat/plugins?v   → analysis-ik 8.13.4
  #    ★★ 第 ③ 条最容易漏：容器起着、健康是绿的，但 IK 没装 ——
  #       搜索照样能跑，只是退化回 standard 的逐字切分（相关性变差）。
  #       这个状态【不报任何错】，所以必须主动查一次。
  elasticsearch:
    # ★ 不给默认值（这里给的是【开发环境】的默认值，生产那份在 application.yml 里
    #   是 ${ES_URIS} 无默认）—— 同 novel.jwt.secret 的策略。
    uris: ${ES_URIS:http://192.168.127.137:9200}

    # ★★ 连接超时【必须显式配】，不能用默认值。
    #
    #    ES 客户端默认的连接超时是 1 秒、socket 超时 30 秒。
    #    30 秒意味着：ES 挂了（端口通但进程假死）时，一次搜索要挂 30 秒才失败、
    #    ★ 然后才轮到降级路径 —— 而用户等不了 30 秒。
    #    Tomcat 的线程会被这 30 秒占满，症状是「整个搜索页转圈，
    #    然后其它接口也开始变慢」。
    #
    #    ★ 2 秒 / 10 秒是【开发期】取值：本机到虚拟机正常在 10ms 以内，
    #      2 秒没连上就是真的有问题。10 秒的读超时留得比连接超时宽，
    #      是因为全量重建时的 bulk 写入确实会慢（那是另一条路径，见 IndexService）。
    #    ★ 生产（跨主机）要结合 M5 的熔断一起调。
    connection-timeout: 2s
    socket-timeout: 10s

  # ---------------- Redis ----------------
  # ★ Spring Boot 3 里路径是 spring.data.redis，不是 spring.redis
  #   （老教程里写的 spring.redis 在 Boot 3 下会被静默忽略，连接直接走默认的 localhost）
  #
  # ★★ 本服务【真的要用】Redis，不是为了迁就 RedisConfig 才留的。
  #    用途只有一处，但那一处不能省：
  #      全量重建索引的【分布式锁】（SET NX EX）
  #      ★ 定时全量重建是【计算型】任务，按 SchedulingConfig 自己定的规矩
  #        必须加锁 —— 否则起两个 search 实例，两边会在同一个时刻
  #        各自 DELETE 索引再重建，症状是 ES 被反复清空、搜索时好时坏。
  #
  # ★ 配置和 content / interaction 逐字一致（同一个 Redis 实例）。
  data:
    redis:
      host: 192.168.127.137
      port: 6379
      password: redis123456
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16           # 最多 16 个连接
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms

  # ---------------- Nacos 注册中心 ----------------
  #
  # 加上这一段，本服务就在 Nacos 上注册成了一个实例，
  # 网关的 lb://novel-search 才找得到它。
  #
  # ★ 这里【只有服务发现】，没有 Nacos 配置中心。
  #   第二期不接 Nacos Config —— 见 novel-gateway/application.yml 顶部
  #   那段「路由为什么写在本地」。
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.127.137:8848

        # ★★ 这两行【必须】写在 discovery 下面，不能只写在外层
        #    spring.cloud.nacos.username 上。
        #
        #    容器里的 Nacos 开了鉴权（NACOS_AUTH_ENABLE=true），
        #    只配了后者的话症状是「配置能拉、服务注册不上」——
        #    报 403，或者客户端直接假死在那儿不动。
        #    ★ 而且报错信息里【完全看不到】配置项的事。
        #
        #    nacos/nacos 是 Nacos 自带的固定演示账号，和下面 MySQL 的
        #    root123456 同一性质 —— 本地搭环境用的固定值，不含真实凭据。
        #    生产环境请改掉（docs/部署.md）。
        username: nacos
        password: nacos

        # ★★ 这一行在 Windows 上【必须写】，M4 起是【五个进程】都要写。
        #
        #    Nacos 客户端默认取「第一块非 loopback 网卡」的地址。
        #    装了 VMware / VirtualBox / Hyper-V / WSL 之后，那个「第一块」
        #    很可能是 192.168.56.1 这类虚拟网卡地址 —— 而本服务根本不在那儿。
        #
        #    症状极有迷惑性：Nacos 控制台上服务列表、实例数一切正常，
        #    但 http://localhost:8080/api/search 返回 503，
        #    日志是「Unable to find instance for novel-search」或连接超时。
        #    ★★ 看起来【完全像是网关的路由配错了】，会让人去翻网关的 yml ——
        #       而 M4 恰好【真的】动了网关的路由表，所以这个误导这次格外强。
        #
        #    网关那边（novel-gateway/application.yml）有同样的一行。
        ip: 127.0.0.1

    # ---------------- Feign 超时（M4） ----------------
    #
    # ★★ 不加这两行的后果，比「慢」严重得多：
    #    Feign 默认【没有读超时】。对端只要不是干脆地拒绝连接，
    #    而是「连上了但不回」（进程假死、GC 卡住、网络半通），
    #    这个请求就会一直挂在那儿，把 Tomcat 的工作线程一起占住。
    #    占满之后本服务的所有接口都开始排队 ——
    #    症状是「整个站点越来越慢直到完全打不开」，
    #    而日志里可能干干净净，因为那些线程都还「在执行中」。
    #
    # ★ 本服务【只有一个对端】：novel-content（装配数据 + 降级路径）。
    #
    # ★★ 但这一次的取值要留意一个区别：降级路径也会走这条 Feign。
    #    也就是说 content 慢的时候，搜索会【先等 ES、再等 content】，
    #    总耗时是两者之和。2s + 5s 在开发期够用，
    #    但它正是 M5 要做熔断/降级的理由 —— M4 只记录，不处理。
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000

# ---------------- 内部令牌 ----------------
#
# ★★ 这是【服务间调用】和【网关到下游】的共享密钥，用的都是同一个值。
#
#    它防的是：有人绕过网关，直接 curl :8084 / :8083 / :8082 / :8081 并自己伪造
#    X-User-Id / X-Roles 头，从而变成管理员。
#    下游的 HeaderAuthenticationFilter 看到没有这个令牌（或值不对），
#    就把那些身份头【整份忽略】、按匿名处理，
#    /internal/** 更是直接 403。
#
# ★ 所以它的值必须在【六个地方】完全一致：
#    网关 application.yml、novel-auth、novel-content、novel-interaction、
#    ★ novel-search、以及调用方手工 curl 时带的头。
#    不一致的症状是「全站 401」或「/internal/** 403」——
#    看起来像网关没转发、像服务没注册，唯独不像密钥。
#    ★ 排错时先 grep 一下：
#      grep -rn "INTERNAL_TOKEN" backend/*/src/main/resources/application*.yml
#
# ★★ 下面这个值是【开发专用】的明文常量（和 jwt.secret 同一性质）：
#    它只为了让 clone 下来不配任何环境变量就能跑，不含任何真实凭据。
#    生产环境必须靠环境变量 INTERNAL_TOKEN 覆盖它（见 application.yml）。
novel:
  internal:
    token: ${INTERNAL_TOKEN:novel-dev-only-internal-token-please-change-in-production-2026}

  # ---------------- JWT ----------------
  # ★ 本服务不签发也不验签 token（验签在网关）。这一段存在的唯一原因是
  #   com.novel.common.security.JwtUtil 是个 @Component，会被扫到并被实例化，
  #   而它的两个 @Value 占位符没有默认值。详见 application.yml 里那段长注释。
  #
  # ★★ 所以它的值必须和 novel-auth（真正签发 token 的那个）【完全一致】——
  #    不一致不会报错，但两边对「密钥长度」「有效期」的判断会出现偏差。
  jwt:
    # 开发环境的默认密钥。这样 clone 下来不配任何环境变量就能直接跑。
    #
    # ★ 两点必须知道：
    #   1. 长度必须 ≥ 32 字节。jjwt 用 HMAC-SHA256 签名，密钥短于 256 bit
    #      会直接抛 WeakKeyException（HMAC 的密钥越短越容易被暴力破解，
    #      所以它主动拒绝）。这一串是 54 个字符，绰绰有余。
    #   2. 这个值【只用于本地开发】，明文写在提交到 git 的文件里。
    #      生产环境靠环境变量 JWT_SECRET 覆盖它（见 application.yml）。
    secret: ${JWT_SECRET:novel-dev-only-jwt-secret-please-change-in-production-2026}

# ---------------- RocketMQ（M4 新增到本服务） ----------------
#
# ★★ 这一段是【顶层】的，不在 spring: 下面 —— rocketmq-spring 的前缀就叫
#    rocketmq（RocketMQProperties 上是 @ConfigurationProperties("rocketmq")）。
#    写成 spring.rocketmq.* 【不会报错】，只会被静默忽略、broker 地址退回默认的
#    localhost:9876，症状是「消息像发出去了，消费者一条都没收到」。
#
# ★ name-server 是虚拟机 Docker 里的容器（不是 localhost —— 后端跑在 Windows 上，
#   broker 和 MySQL/Redis/Nacos/ES 一样在虚拟机里）。
#   9876 是 NameServer；broker 的 10911 是 NameServer 查出来告诉客户端的，不用配。
#
# ★ 值必须和另外三份 application-dev.yml 一致（content / interaction / auth）。
#
# ★★ 本服务【只消费，不生产】，所以这里【只有】name-server ——
#    没有 producer.group，也没有 consumer.* 那一段，两处都不是漏了：
#      · producer.group —— S7 实测证否（删掉之后监听器照常注册、照常消费），
#        完整论证在 application.yml 同位置那段注释里；
#      · consumer.* —— RocketMQProperties$PullConsumer 上【根本没有】
#        max-reconsume-times 这个字段，写成 rocketmq.consumer.max-reconsume-times
#        会被 Spring Boot 的宽松绑定【静默忽略】。正确位置是每个
#        @RocketMQMessageListener 上的 maxReconsumeTimes = 3（content 那边实测记的）。
rocketmq:
  name-server: 192.168.127.137:9876

# ---------------- 接口文档显示开关 ----------------
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# ---------------- 日志：开发期看详细 SQL ----------------
logging:
  level:
    com.novel: debug
    # ★★ 打开 ES 客户端的请求日志 —— 开发期排「为什么搜不到」时，
    #    能看到真正发出去的 DSL 是什么样，比猜快得多。
    #    ★ 但它在 debug 级别，且【会打印整段 DSL】，所以只开 dev。
    org.springframework.data.elasticsearch.client.WIRE: debug
    # ★ 关掉 ES 客户端里那个每隔 10 秒的节点健康检查 debug 刷屏 ——
    #   它会把真正有用的日志冲走，而它自己不含任何诊断价值。
    tracer: warn

  # ---------------- 同时写一份文件到 backend/logs/ ----------------
  #
  # ★ 为什么写文件：开发期后端是通过
  #     Start-Process java -jar target/novel-search.jar -WorkingDirectory backend
  #   起的（隐藏窗口），控制台看不到；而且排障时经常需要回头翻
  #   「刚才那次请求到底报了什么」，翻不了滚动的窗口就抓瞎。
  #
  # ★ 路径为什么可以写成相对路径：启动命令里 jar 本身就写成
  #   `target/novel-search.jar`（相对路径），所以工作目录必然是
  #   backend/ 这一个；`logs/` 也就必然落到 backend/logs/。
  #   ⚠️ 但五份配置的 file.name 各不相同（否则五个进程会抢同一个文件），
  #      所以五个 jar 都必须用 -WorkingDirectory backend 启动 ——
  #      任何一个换成 backend/novel-xxx/ ，它的日志就会静默换目录。
  #
  # ★ .gitignore 里已有 `logs/` 和 `*.log`，不会误提交。
  file:
    name: logs/novel-search.log

  # 控制台只显示到毫秒，翻历史的时候分不清是哪天 —— 文件里带上完整日期
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

  # ★ 一定要封顶：这几个服务常年开着不重启，没有滚动策略的话
  #   一个 debug 级别的日志文件能长到几个 G（ES 的 WIRE 日志尤其能刷）。
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
