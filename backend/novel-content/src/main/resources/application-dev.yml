# ============================================================
# 开发环境配置 · 内容服务（novel-content :8082）
# ============================================================
# ★★★ 这个文件里的 IP 要改成你自己的虚拟机 IP ★★★
#
# 怎么查：在虚拟机上执行
#     hostname -I
#   取输出的第一个 IP（形如 192.168.127.137）
#
# 本文件里【三处】192.168.127.137 都要换成它（就是下面这三个键的值，
# 别去数行数 —— 上面那句 "形如 192.168.127.137" 是举例，不用改）：
#   ① spring.datasource.url
#   ② spring.data.redis.host
#   ③ spring.cloud.nacos.discovery.server-addr
#
# ★ ③ 是唯一一个「值里带端口」的（192.168.127.137:8848），改 IP 时
#   把端口一起留着 —— 8848 是 Nacos 的默认 HTTP 端口，不是变量。
#
# ★★ M2 之后有【四份】application-dev.yml（gateway/auth/content/interaction）。
#    ①②③ 三处在四份里【取值完全相同】—— 因为 M2 决定「一个 schema + 表归属独占」，
#    不物理拆库。所以改虚拟机 IP 时要改四份，不是一份。
#    漏改的症状：那个服务起不来（连不上库）或注册不上（连不上 Nacos）。
#
# 为什么不用 localhost：后端跑在你的 Windows 上，
# MySQL/Redis/Nacos 跑在虚拟机的 Docker 里，是两个不同的机器。
# localhost 指的是 Windows 本机，那里没有 MySQL。
# ============================================================

spring:

  # ---------------- MySQL ----------------
  # ★★ 和 novel-auth / novel-interaction 连的是【同一个库】。
  #    这不是疏漏，是 M2 拍板的决定 1：一个 novel schema + 表归属独占。
  #    大纲 §三 约束 6 要的是「每个服务只访问自己的表」，一个 schema 完全满足。
  #    ★ 「表归属独占」是纪律，不是数据库强制的 —— 违反它不会报错，
  #      所以每个模块的 mapper 注释里都写清了自己拥有哪些表。
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.127.137:3306/novel?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&allowMultiQueries=true
    username: root
    password: root123456

    # HikariCP 连接池（Spring Boot 默认，不用额外引依赖）
    hikari:
      pool-name: NovelContentHikariPool   # ★ 四个进程各起一个池，池名要能区分开
      minimum-idle: 5              # 最少保持 5 个空闲连接
      maximum-pool-size: 20        # 最多 20 个连接
      idle-timeout: 600000         # 空闲连接超过 10 分钟回收
      max-lifetime: 1800000        # ★ 连接最长活 30 分钟，必须小于 MySQL 的 wait_timeout
      connection-timeout: 10000    # 拿不到连接时最多等 10 秒就报错，别无限等
      connection-test-query: SELECT 1

  # ---------------- Redis ----------------
  # ★ Spring Boot 3 里路径是 spring.data.redis，不是 spring.redis
  #   （老教程里写的 spring.redis 在 Boot 3 下会被静默忽略，连接直接走默认的 localhost）
  #
  # ★★ 本服务【真的要用】Redis，不只是因为 RedisConfig 被扫到。
  #    M3 之后还剩两处（改造前是「阅读量脏集」，那个类已经删了）：
  #      ① AuditRecordConsumer 的消费幂等：SETNX novel:mq:idempotent:{messageKey}
  #      ② NovelStatWriteGuard 的防乱序守卫：一段 Lua 脚本在
  #         novel:novel:stat_at:{novelId} 这个 Hash 里记「某个字段最后一次应用的时刻」，
  #         比它旧的消息直接丢弃（收藏数 / 评分推的是绝对值，乱序会让它回退）
  #    ⚠️ 所以 Redis 挂了不是「未读数不准」：审核流水会积压（消费抛异常 → 重试），
  #       收藏数 / 评分会停在旧值（守卫偏向丢弃，等对账任务纠回来）。
  #    ★ 注意【阅读量不受影响】—— M3 把它整个搬出了 Redis
  #       （进程内 LongAdder 聚合 + MQ），它现在是全站最不依赖 Redis 的那条写路径。
  data:
    redis:
      host: 192.168.127.137
      port: 6379
      password: redis123456
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16           # 最多 16 个连接
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms

  # ---------------- Nacos 注册中心 ----------------
  #
  # 加上这一段，本服务就在 Nacos 上注册成了一个实例，
  # 网关的 lb://novel-content 才找得到它。
  #
  # ★ 这里【只有服务发现】，没有 Nacos 配置中心。
  #   第二期不接 Nacos Config —— 见 novel-gateway/application.yml 顶部
  #   那段「路由为什么写在本地」。
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.127.137:8848

        # ★★ 这两行【必须】写在 discovery 下面，不能只写在外层
        #    spring.cloud.nacos.username 上。
        #
        #    容器里的 Nacos 开了鉴权（NACOS_AUTH_ENABLE=true），
        #    只配了后者的话症状是「配置能拉、服务注册不上」——
        #    报 403，或者客户端直接假死在那儿不动。
        #    ★ 而且报错信息里【完全看不到】配置项的事，
        #      会让人往网络、往 Nacos 服务端查，方向全错。
        #
        #    nacos/nacos 是 Nacos 自带的固定演示账号，和下面 MySQL 的
        #    root123456 同一性质 —— 本地搭环境用的固定值，不含真实凭据。
        #    生产环境请改掉（docs/部署.md）。
        username: nacos
        password: nacos

        # ★★ 这一行在 Windows 上【必须写】，M2 之后是【四个服务】都要写。
        #
        #    Nacos 客户端默认取「第一块非 loopback 网卡」的地址。
        #    装了 VMware / VirtualBox / Hyper-V / WSL 之后，那个「第一块」
        #    很可能是 192.168.56.1 这类虚拟网卡地址 —— 而本服务根本不在那儿。
        #
        #    症状极有迷惑性：Nacos 控制台上服务列表、实例数一切正常，
        #    但 http://localhost:8080/api/novels 返回 503，
        #    日志是「Unable to find instance for novel-content」或连接超时。
        #    看起来【完全像是网关的路由配错了】，会让人去翻网关的 yml。
        #
        #    网关那边（novel-gateway/application.yml）有同样的一行。
        ip: 127.0.0.1

    # ---------------- Feign 超时（M2） ----------------
    #
    # ★★ 不加这两行的后果，比「慢」严重得多。
    #
    # ★★ M5 订正一处事实（论点不变）：这里原来写的是
    #    「Feign 默认【没有读超时】」—— 不准确。feign-core 的
    #    Request.Options 无参构造给的是 **connect 10s / read 60s**
    #    （13.3 的字节码实测：ldc2_w 10 / ldc2_w 60，单位都是 SECONDS）。
    #    ★ 而【结论方向完全没错、下面一个字都不用改】：
    #      60 秒对「占住 Tomcat 工作线程」来说和无限几乎没区别。
    #      改的是数字，不是论点 —— 所以这段论证留着，只把数字说准。
    #
    #    对端只要不是干脆地拒绝连接，
    #    而是「连上了但不回」（进程假死、GC 卡住、网络半通），
    #    这个请求就会一直挂在那儿，把 Tomcat 的工作线程一起占住。
    #    占满之后本服务的所有接口都开始排队 ——
    #    症状是「整个站点越来越慢直到完全打不开」，
    #    而日志里可能干干净净，因为那些线程都还「在执行中」。
    #
    # ★ M2 之后本服务【有两个对端】：novel-auth（取作者昵称）
    #   和 novel-interaction（取评论正文）。后者是审核日志列表在用，
    #   属于管理端低频操作，但超时挂住的后果是一样的。
    #
    # ★ 2 秒 / 5 秒是【开发期】的取值：本机到本机的调用正常在 10ms 以内，
    #   2 秒没连上就是真的有问题。
    #   生产（跨主机）应**收紧**到 1s / 3s 左右，并结合熔断一起调。
    #   ★ M5 订正：这里原来写的是「**放宽**到 1s / 3s」—— 方向说反了。
    #     2s/5s → 1s/3s 是【更短、更严】，不是更松。
    #     要表达的意思其实一直是对的（生产要更快地失败，
    #     否则被占住的 Tomcat 线程更多），只是动词用错了。
    #   ★★ 生产取值这件事的落点在 docs/部署.md：仓库里没有
    #      application-prod.yml（它在 .gitignore 里，部署时手建），
    #      所以【这个文件里的数只对开发期负责】。
    #
    # ★★ 熔断的开关【不在这个文件里】—— 见 application.yml 的
    #    `feign.sentinel.enabled`。它放上面那份是有理由的（那是结构性的
    #    开关，不是每环境的取值），理由写在那一段注释里。
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000

    # ---------------- Sentinel 自己的日志（M5 / R14） ----------------
    #
    # ★★ 不配这一段的后果，是【日志被写到业务日志目录外面去】：
    #    Sentinel 默认把它的日志写进 ${user.home}/logs/csp/，
    #    也就是 C:\Users\<你>\logs\csp\ —— 实测确认过，
    #    那里会冒出 command-center.log.* 和 novel-content-metrics.log.*。
    #
    #    症状不是报错，是【排查时以为熔断什么都没记】：
    #    出事了先翻 backend/logs/novel-content.log，翻不到任何熔断相关的东西，
    #    于是判断「规则没生效」—— 而它其实一直好好的，只是日志在别处。
    #    ★ 这和 CLAUDE.md 里那条「日志路径跟着工作目录走、改了就静默换目录」
    #      是同一类账：路径这件事出错永远没有报错。
    #
    # ★ 为什么是相对路径 `logs/csp`：和上面 logging.file.name 同源 ——
    #   启动命令写的是 `java -jar target/novel-content.jar -WorkingDirectory backend`，
    #   所以相对路径必然落到 backend/logs/csp/。
    #   ★ 于是四个服务【共用同一个 logs/ 根目录】，这和 8081~8084 四份
    #     日志文件放在一起是同一个安排。
    #
    # ★★ switch-pid 要开，理由和 logging.file.name 那条完全一样：
    #    【几个进程不能写同一个文件】。三个服务共用 backend/logs/csp/
    #    之后，command-center.log 这个名字是每个进程都会写的。
    #
    #    ★★ 实测（M5 S4，配这一项【之前】）—— 证据是 sentinel-block.log：
    #
    #        ls ~/logs/csp/
    #          sentinel-block.log                        ← ★ 既没有 PID，也没有日期
    #          sentinel-record.log.2026-09-23.0 / .0.1 / .0.2
    #          command-center.log.2026-09-23.0 / .0.1 / .0.2
    #          novel-content-metrics.log.2026-09-23 …
    #          novel-interaction-metrics.log.2026-09-23 …
    #          novel-search-metrics.log.2026-09-23 …
    #
    #      · metrics 那几个按 app 名分开，天然不冲突（它们带 .idx，是按大小滚的）；
    #      · command-center / sentinel-record 各出现了三份 .0 / .0.1 / .0.2，
    #        正好对应三个服务 —— 名字里【没有 PID】，是各自滚出来的序号；
    #      · ★★ 而 sentinel-block.log 连序号都没有，**就是一个文件**。
    #        被拦下来的请求记在这里，熔断排查第一个要看的就是它 ——
    #        三个服务往同一个文件里写。
    #
    #    开了 switch-pid 之后文件名带 PID，上面三行全部天然分开。
    #
    # ★ 配置项的落点（这一段的键名是【对不上的】，所以写清楚映射关系）：
    #
    #     spring.cloud.sentinel.log.dir        → 系统属性 csp.sentinel.log.dir
    #     spring.cloud.sentinel.log.switch-pid → 系统属性 csp.sentinel.log.use.pid
    #
    #   ★★ 注意第二行：【Spring 叫 switch-pid，Sentinel 叫 use.pid】，
    #      两个名字不一样。写 Spring 那一侧就对，但排查时去 Sentinel 的
    #      文档/源码里搜 switch-pid 会【搜不到】—— 那边只有 use.pid。
    #      核实方式：javap SentinelApplicationContextInitializer，
    #      能看到 ldc "csp.sentinel.log.use.pid" 紧跟着
    #      invokevirtual SentinelProperties$Log.isSwitchPid()。
    #
    #   ★ 直接往 yml 里写 csp.sentinel.log.dir 是【无效】的 ——
    #     它是 JVM 系统属性，Spring 不会把一个自定义键灌进去。
    #     那两行映射是 SentinelApplicationContextInitializer 显式做的。
    sentinel:
      log:
        dir: logs/csp
        switch-pid: true

# ---------------- 文件上传路径 ----------------
# 作品封面（本服务写）存这里。开发期先存本地磁盘，
# 第二期接入对象存储（MinIO / OSS）时只改这一个配置项
novel:
  upload:
    # ★★ 这个路径必须和 novel-auth（头像，同一目录的 avatar/ 子目录）
    #    写成【同一个绝对路径】。
    #
    #    原因：/uploads/** 这条路由在 M2 之后仍然由 novel-interaction 提供
    #    （它是唯一一个「读上传目录」的服务），而【写】发生在
    #    content（封面）和 auth（头像）。三个进程只有在
    #    「同一个文件系统的同一个绝对路径」这个前提下才互相看得见。
    #
    #    ★ 生产上三个服务各有自己的容器文件系统 → 这么写必然是 404。
    #      这是 M1 R10 记录的同一个问题，M2 沿记录，M5 接对象存储时解决。
    #      ★ 换句话说：开发期它能工作，靠的是「都在你这一台 Windows 上」。
    path: ${user.home}/novel-uploads/
    url-prefix: /uploads/

  # ---------------- 内部令牌 ----------------
  #
  # ★★ 这是【服务间调用】和【网关到下游】的共享密钥，用的都是同一个值。
  #
  #    它防的是：有人绕过网关，直接 curl :8082 / :8083 / :8081 并自己伪造
  #    X-User-Id / X-Roles 头，从而变成管理员。
  #    下游的 HeaderAuthenticationFilter 看到没有这个令牌（或值不对），
  #    就把那些身份头【整份忽略】、按匿名处理，
  #    /internal/** 更是直接 403。
  #
  # ★ 所以它的值必须在【五个地方】完全一致：
  #    网关 application.yml、novel-auth、novel-content、novel-interaction、
  #    以及调用方手工 curl 时带的头。
  #    不一致的症状是「全站 401」或「/internal/** 403」——
  #    看起来像网关没转发、像服务没注册，唯独不像密钥。
  #    ★ 排错时先 grep 一下：grep -rn "internal" backend/*/src/main/resources/application*.yml
  #
  # ★★ 下面这个值是【开发专用】的明文常量（和 jwt.secret 同一性质）：
  #    它只为了让 clone 下来不配任何环境变量就能跑，不含任何真实凭据。
  #    生产环境必须靠环境变量 INTERNAL_TOKEN 覆盖它（见 application.yml）——
  #    那边【故意不写默认值】，不配就启动失败，而不是悄悄用一个公开的弱密钥。
  #
  # ★ 剩余边界（M5 治理项）：共享密钥只能证明「调用方知道这个字符串」，
  #   证明不了「调用方是谁」。更彻底的做法是内网隔离 + mTLS。
  #   生产上另外还有一层：这几个端口【不对外】，只暴露网关。
  internal:
    token: ${INTERNAL_TOKEN:novel-dev-only-internal-token-please-change-in-production-2026}

  # ---------------- JWT ----------------
  # ★ 本服务不签发也不验签 token（验签在网关）。这一段存在的唯一原因是
  #   com.novel.common.security.JwtUtil 是个 @Component，会被扫到并被实例化，
  #   而它的两个 @Value 占位符没有默认值。详见 application.yml 里那段长注释。
  #
  # ★★ 所以它的值必须和 novel-auth（真正签发 token 的那个）【完全一致】——
  #    不一致不会报错，但两边对「密钥长度」「有效期」的判断会出现偏差。
  jwt:
    # 开发环境的默认密钥。这样 clone 下来不配任何环境变量就能直接跑。
    #
    # ★ 两点必须知道：
    #   1. 长度必须 ≥ 32 字节。jjwt 用 HMAC-SHA256 签名，密钥短于 256 bit
    #      会直接抛 WeakKeyException（HMAC 的密钥越短越容易被暴力破解，
    #      所以它主动拒绝）。这一串是 54 个字符，绰绰有余。
    #   2. 这个值【只用于本地开发】，明文写在提交到 git 的文件里。
    #      生产环境靠环境变量 JWT_SECRET 覆盖它（见 application.yml）。
    secret: ${JWT_SECRET:novel-dev-only-jwt-secret-please-change-in-production-2026}

  # ---------------- AI 的加密密钥（E3 收尾补） ----------------
  #
  # ★★ 它保护的是库里的 ai_config.api_key（管理员在「AI 配置」页填的那把真 Key）。
  #    只有 novel-content 用得到它，所以只有本文件有这么一段。
  #
  # ★ 形状与上面的 INTERNAL_TOKEN / JWT_SECRET【逐字同款】：占位符 + 一个 dev 常量。
  #    ★★ 必须是 ${AI_KEY_SECRET:…} 这个形状，【不能】把值写成裸字面量 ——
  #      裸字面量会整条覆盖 application.yml 那一行（profile 文件优先级更高），
  #      于是环境变量 AI_KEY_SECRET 再也覆盖不动它，覆盖那条路就死了。
  #      占位符形式才是「本地不配就能跑」与「生产配了就生效」同时成立的原因。
  #    ★ 生产路径一行没变：application.yml 那边仍是 ${AI_KEY_SECRET:}（空默认）→ 5002。
  #      所以「生产忘配 → 加密变装饰」那条失败模式【没有】被这次改动放过。
  #
  # ★★★ 代价与上面两行不同性质，必须说清楚：
  #    INTERNAL_TOKEN / JWT_SECRET 保护的是【一次性开发数据】（本地虚拟机的库、种子账号），
  #    这个值保护的是【你自己那把真 DeepSeek Key】—— 而它现在写在 git 里，
  #    等于 **dev 环境里这把 Key 的加密只是【形式】**：拿到本仓库 + 那个库的人都能解开。
  #    ★ 所以走这条路的前提是：**dev 库里放的是一把单独申请、限额很低、随时能吊销的 Key**，
  #      真 Key 只放生产。这是为「本地零配置、IDEA 与 java -jar 行为一致」付的价
  #      （演示时不必先讲一段「环境变量怎么配」）。
  #    ★ 反过来说：想在小说的 dev 环境里存主力 Key，就别用这条默认值 ——
  #      把本行删掉（或显式给 AI_KEY_SECRET），让 application.yml 那条空默认生效。
  #
  # ★★ 它自己还撞上 AiCrypto 的一处边界：那边的密钥派生是 SHA-256(secret) 直接当 AES 密钥，
  #    而上 PBKDF2 被否掉的前提是「这个 secret 是运维生成的高熵随机串」。
  #    下面这一串【恰恰不是】随机串 —— 它是个公开的、好记的常量。
  #      · 在 dev 里这不多损失什么：密钥本来就公开，爆破它没有意义；
  #      · 但它又一次说明【dev 库里的 Key 只能是不心疼的那把】——见上。
  #
  # ★ 历史上的 E1 取舍是「绝不给默认值」，那条论证与它防的失败模式都仍然成立，
  #   只是现在被限定在【生产路径】上。application.yml / AiCrypto / CLAUDE.md / 部署文档里
  #   那几处说法都已按 profile 补了限定 —— 单说「有默认值」或「没有默认值」都是半句话。
  #
  # ★★ 换值之后库里已存的 api_key 密文【全部解不开】（GCM auth tag 对不上 → 抛异常，不是乱码）。
  ai:
    key-secret: ${AI_KEY_SECRET:novel-dev-only-ai-key-secret-please-change-in-production-2026}

# ---------------- RocketMQ（M3 新增） ----------------
#
# ★★ 这一段是【顶层】的，不在 spring: 下面 —— rocketmq-spring 的前缀就叫
#    rocketmq（RocketMQProperties 上是 @ConfigurationProperties("rocketmq")）。
#    写成 spring.rocketmq.* 【不会报错】，只会被静默忽略、broker 地址退回默认的
#    localhost:9876，症状是「消息像发出去了，消费者一条都没收到」。
#
# ★★★ 这两个键【必须成对配齐】，而且漏了【不报错】—— 这是本节最大的坑。
#    查过 2.3.6 的字节码，RocketMQAutoConfiguration 的条件是：
#      defaultMQProducer  @ConditionalOnProperty(prefix="rocketmq",
#                            value={"name-server","producer.group"})
#      rocketMQTemplate   @ConditionalOnMissingBean("rocketMQTemplate")
#                         + 条件是「存在 DefaultMQProducer 或 DefaultLitePullConsumer」
#    所以少配任何一个 → producer bean 不创建 → RocketMQTemplate 不创建。
#    ★ 服务照样起得来，直到某个 @Autowired RocketMQTemplate 的地方报
#      「no bean of type 'RocketMQTemplate'」。★ 也就是说：配错的表现是
#      「启动失败，但报错信息里一个 rocketmq 字样都没有」，
#      会把人往依赖、往 @ComponentScan 上带，方向全错。
#
# ★ name-server 是虚拟机 Docker 里的容器（不是 localhost —— 后端跑在 Windows 上，
#   broker 和 MySQL/Redis/Nacos 一样在虚拟机里）。
#   9876 是 NameServer；broker 的 10911 是 NameServer 查出来告诉客户端的，不用配。
#
# ★ 值必须在【三份】application-dev.yml 里一致（content / interaction / auth）——
#   和 MySQL/Redis/Nacos 那三处是同一个道理（见文件头）。
rocketmq:
  name-server: 192.168.127.137:9876

  # producer.group 是【生产者组】。它【不是】消费组 —— 消费组在每个
  # @RocketMQMessageListener 上单独写（一个 (服务, Tag) 一个组，见 MqConstant）。
  #
  # ★ content 和 interaction 共用 novel-producer：它们发的是同一批业务消息，
  #   不需要各自独立的身份。★ 只有 auth 例外 —— 它发事务消息，事务回查
  #   是按事务组做的，那个身份必须是独立的（MqConstant.PRODUCER_GROUP_AUTH_TX）。
  producer:
    group: novel-producer

  # ★★ 这里【故意没有】rocketmq.consumer.* 这一段，不是漏了。
  #    RocketMQProperties$PullConsumer 上【根本没有】max-reconsume-times 这个字段
  #    （字段只有 group / topic / messageModel / selectorType / selectorExpression /
  #      accessKey / secretKey / pullBatchSize / enableMsgTrace / customizedTraceTopic /
  #      tlsEnable / namespace / namespaceV2 / instanceName）。
  #    写成 rocketmq.consumer.max-reconsume-times 会被 Spring Boot 的宽松绑定
  #    【静默忽略】—— 配了，也启动成功了，重试次数还是默认值，没有任何提示。
  #    ★ 正确位置是每个 @RocketMQMessageListener 上的 maxReconsumeTimes = 3。
  #      它的默认值是 -1，在【顺序消费】下等于 Integer.MAX_VALUE ——
  #      不写就是「永不放弃」。
  #      ★★ 但注意：M3 实测把「不写 = 永不进 DLQ = 永久卡死」这个推论
  #         修正过一次 —— 那只在【没写】的时候成立。显式写了 3 之后，
  #         顺序消息重试 3 次就进 %DLQ%，队列随之恢复（实测记录见
  #         MqConstant 的类注释）。所以这三行注释的落点是
  #         「必须显式写」，而不是「顺序消息不可救」。

# ---------------- 接口文档显示开关 ----------------
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# ---------------- 日志：开发期看详细 SQL ----------------
logging:
  level:
    com.novel: debug
    com.novel.modules: debug
    org.springframework.jdbc: debug

  # ---------------- 同时写一份文件到 backend/logs/ ----------------
  #
  # ★ 为什么写文件：开发期后端是通过
  #     Start-Process java -jar target/novel-content.jar -WorkingDirectory backend
  #   起的（隐藏窗口），控制台看不到；而且排障时经常需要回头翻
  #   「刚才那次请求到底报了什么」，翻不了滚动的窗口就抓瞎。
  #
  # ★ 路径为什么可以写成相对路径：启动命令里 jar 本身就写成
  #   `target/novel-content.jar`（相对路径），所以工作目录必然是
  #   backend/ 这一个；`logs/` 也就必然落到 backend/logs/。
  #   ⚠️ 但四份配置的 file.name 各不相同（否则四个进程会抢同一个文件），
  #      所以四个 jar 都必须用 -WorkingDirectory backend 启动 ——
  #      任何一个换成 backend/novel-xxx/ ，它的日志就会静默换目录。
  #
  # ★ 放在 dev 而不是 application.yml：生产是跑在容器里的，
  #   日志应该走 stdout 交给采集器，落文件反而会在容器里堆着。
  #
  # ★ .gitignore 里已有 `logs/` 和 `*.log`，不会误提交。
  file:
    name: logs/novel-content.log

  # 控制台只显示到毫秒，翻历史的时候分不清是哪天 —— 文件里带上完整日期
  # ★ M5 起这里也要带 traceId。console 和 file 是【两份独立】的 pattern，
  #   只改 application.yml 那份的症状是「控制台有、文件里没有」——
  #   而事后查日志看的恰恰是文件。两份必须同时改。
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId}] [%thread] %logger{36} - %msg%n"

  # ★ 一定要封顶：这几个服务常年开着不重启，没有滚动策略的话
  #   一个 debug 级别的日志文件能长到几个 G（SQL 全在打）。
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
