# ============================================================
# 小说管理系统 · 内容服务主配置
# ============================================================
# 这里只放【所有环境都一样】的配置。
# 数据库地址、Redis 密码这类会变的，全部放 application-dev.yml。
#
# 启动时用 --spring.profiles.active=dev 或 IDE 里配 active profile 切换。
#
# ★ M2 之前这个文件是 novel-backend 的，现在 novel-content 和
#   novel-interaction 各有一份。★ 两份是【手抄】关系，不是共享的：
#   凡是标了 "★★ 镜像" 的段落，两边必须逐字一致 —— 漏改一边不会报错，
#   只会让同一个字段在这个接口有、在那个接口没有，前端得写两套解析。
#   找齐：grep -n "★ 镜像" backend/novel-*/src/main/resources/application.yml
# ============================================================

server:
  # ★★ 第二期 M2 起，本服务独立成进程，端口 8082。
  #
  #    为什么是「网关占 8080」而不是「网关另开一个端口」：
  #    dev-proxy/vite.config.js 和三个前端的 request.js 里写的都是 8080，
  #    而那 12 个文件是 md5 锁定的、一个字节都不能改。
  #    把网关放在 8080，它们【一行都不用动】—— 因为 8080 上确实还有东西在接。
  #
  #    ★ 本服务【不直接对外】。浏览器 :3000 → dev-proxy → :8080 网关
  #      → lb://novel-content → 这里（:8082）。开发期要直连是可以的
  #      （比如排错时绕过网关），但正常入口只有 :3000 一个。
  #
  #    ★ 8082 这个数字不是随便挑的：大纲 §四目录结构写的是
  #      auth 8081 / content 8082 / interaction 8083 / search 8084。
  port: 8082
  servlet:
    encoding:
      charset: UTF-8
      force: true      # 强制请求和响应都用 UTF-8，否则中文会乱码

spring:
  application:
    # ★★ 这个名字有四处硬绑定，改它必须同时改：
    #      ① 网关 application.yml 的 lb://novel-content
    #      ② 本模块 pom 的 artifactId / finalName（jar 名）
    #      ③ package.json 的 dev:content
    #      ④ novel-interaction 的 ContentClient 的 @FeignClient(name=...)
    #    漏改④的症状最隐蔽：interaction 调本服务时 Nacos 找不到实例
    #    → 收藏/历史/评论列表 500，而这几个页面的报错信息里
    #    完全看不到「服务名写错了」这件事。
    #
    #    ★★ M2 之前这个名字是 novel-backend —— 也就是说
    #       novel-auth 那个（现已删除的）Feign 客户端当时指的是【那个单体】。
    #       服务一拆，它指的对象从「装着全部业务的单体」变成了
    #       「只管内容域的服务」，所以客户端也改了名（BackendAuditClient
    #       → ContentAuditClient）。
    #    ★★ M3 把那个客户端【整个删掉了】（审核流水改走事务消息，环 #1 断开），
    #       于是「出站方向的绑定」从 auth 换成了 interaction 的 ContentClient ——
    #       **绑定少了一条，不是没了**。改服务名前仍然要 grep 一遍：
    #         grep -rn "novel-content" backend/*/src/
    name: novel-content

  profiles:
    active: dev        # ★ 默认用 dev（连你虚拟机上的 MySQL/Redis）

  # ★★ 镜像：novel-interaction 的 application.yml 里也有一模一样的一段。
  jackson:
    # ⚠️ 这里【故意不写】date-format。
    #
    # 很多人会写 date-format: yyyy-MM-dd HH:mm:ss，然后发现完全没生效 ——
    # 时间依然输出成 "2026-09-19T23:56:13.2551421"。
    # 因为它【只对 java.util.Date 有效】，而项目里用的是 java.time.LocalDateTime，
    # 走的是 Jackson 的 JavaTimeModule，根本不看这一项。而且不报错、不警告。
    #
    # 真正生效的配置在 com.novel.common.config.JacksonConfig（给 LocalDateTime
    # 这个类型注册了序列化器）。那边改一处，全项目的时间格式都跟着变。
    #
    # ★★ 下面三行是【手抄的】，和 novel-interaction 的 application.yml 里
    #    那三行必须逐字一致。JacksonConfig 管的是「LocalDateTime 怎么序列化」，
    #    而「null 要不要返回」「时区是什么」只有 yml 能配，它没有代码形态。
    time-zone: GMT+8
    default-property-inclusion: non_null   # 值为 null 的字段直接不返回，前端少判断
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false

  servlet:
    multipart:
      # ★ 封面图上传住在【本服务】（AuthorUploadController）。
      #   用户头像上传住在 novel-auth（AdminUserController / ReaderProfileController）。
      #   两个服务各配一份，值必须一样，否则同一个用户会遇到
      #   「换头像可以、换封面报 413」这种看起来毫无道理的现象。
      max-file-size: 50MB      # 单个文件上限
      max-request-size: 55MB   # 单次请求上限

  # 【关于 404 处理】不需要在这里配任何东西。
  #
  # 网上老教程会说：要加
  #     throw-exception-if-no-handler-found: true
  #     web.resources.add-mappings: false
  # 才能让 404 走统一响应体 —— 那是 Spring Boot 3.2 之前的做法。
  #
  # ★ 而且 add-mappings: false 会把【静态资源映射整个关掉】，
  #   而 Knife4j 的 /doc.html 正是靠静态资源映射提供的，结果文档页直接 404。
  #
  # Spring Boot 3.2 起，访问不存在的路径会抛 NoResourceFoundException，
  # 在 GlobalExceptionHandler 里接住它即可，不用动任何配置。

# ============================================================
# 熔断降级开关（M5）
# ============================================================
#
# ★★★ 键名是 feign.sentinel.enabled ——【顶级 feign】，不是
#     spring.cloud.openfeign.sentinel.enabled。
#
#     SCA 那边读它的是一行：
#         @ConditionalOnProperty(name = "feign.sentinel.enabled")
#     它是 SCA 自己的注解，【不是】SCOF 的 @ConfigurationProperties ——
#     所以那次 `feign.* → spring.cloud.openfeign.*` 的迁移动不到它。
#
# ★★ 写成「看起来更对」的 spring.cloud.openfeign.sentinel.enabled 会怎样：
#     没有任何类会读那个键。【应用正常启动、一条报错都没有】，
#     而 @FeignClient 上写的 fallbackFactory 永远不会被调用 ——
#     熔断和降级形同虚设，且没有任何症状。这正是 CLAUDE.md 里
#     M3 那条「未知前缀不报错」的又一个适用者。
#     ★ 所以这个键名值得在这里写死一段注释：它没有任何自证机制。
#
# ★ 为什么这条开关在 application.yml、而 Feign 超时在 application-dev.yml：
#     超时是【每个环境不同的取值】，dev 给 2s/5s、生产跨主机要另调；
#     而这个开关是【结构性的】—— 「本服务要不要熔断能力」和
#     跑在哪个环境无关。
#   ★★ 反过来放的后果很具体：仓库里【没有】application-prod.yml
#      （它在 .gitignore 里，部署时按 docs/部署.md 那张表手建），
#      只写进 dev 就意味着生产上这个键【根本不存在】→
#      Sentinel 静默关闭，而所有 fallbackFactory 的代码看起来都是好的。
#
# ★ 开了之后发生什么：@FeignClient 上的 fallbackFactory 会被
#   SentinelInvocationHandler 接上。★ 注意它接的是【所有】异常
#   （源码里是 catch (Throwable)），不只是熔断 —— 所以即使一条规则
#   都没有配，下游连不上时 fallbackFactory 照样会跑。
#   「无规则 = 永不触发」说的是【熔断器】，不是 fallback，别混。
feign:
  sentinel:
    enabled: true

# ============================================================
# 内部令牌
# ============================================================
novel:
  internal:
    # ★★★ 【故意不给默认值】★★★
    #
    # 它是网关到下游、以及服务与服务之间的共享密钥，防的是
    # 「绕开网关直连 :8082 / :8083 / :8081，自己伪造 X-User-Id: 1
    #   + X-Roles: ADMIN 把自己变成管理员」。
    #
    # ★ 为什么不能给默认值：给了默认值，生产环境忘配时会静默用一个
    #   【写在 git 里、全世界都知道】的字符串当密钥。而那等于这道闸不存在，
    #   且没有任何症状 —— 它不像「登录坏了」那样会立刻被发现。
    #
    # ★★ 这个值在 M2 之后必须【五处一致】：
    #      网关 / novel-auth / novel-content / novel-interaction / 手工 curl 的头
    #    少配一处，那个服务就把所有请求当匿名 → 全站 401 或 /internal/** 403。
    #
    # 开发环境的默认值放在 application-dev.yml。
    token: ${INTERNAL_TOKEN}

  # ============================================================
  # JWT（★ 本服务【不验签】，但这一段【不能删】）
  # ============================================================
  jwt:
    #  ★★ 先说清楚：谁在用这段配置？
    #
    #     答案不是「内容服务」（它在网关上就已经验过 token 了），
    #     而是 com.novel.common.security.JwtUtil —— 一个 @Component。
    #
    #     JwtUtil 的构造函数是
    #         JwtUtil(@Value("${novel.jwt.secret}") String secret,
    #                 @Value("${novel.jwt.expire-days}") long expireDays)
    #     ★ 两个占位符【都没有默认值】。而本服务的启动类在 com.novel 包下，
    #       默认组件扫描一定扫得到 com.novel.common.security.JwtUtil，
    #       于是 Spring 一定会去实例化它 → 一定会去解析这两个占位符。
    #
    #     ★ 删掉这一段的后果：启动【直接失败】，报
    #         Could not resolve placeholder 'novel.jwt.secret'
    #       而报错栈指向的是 JwtUtil 的构造器 ——
    #       【不指向】「你的 yml 少了一段」。这正是最费时间的那类错误。
    #
    #     ★ 这与 novel-content 的 pom 里必须有 spring-boot-starter-data-redis
    #       是同一类陷阱（common 里被扫到的 @Component / @Configuration
    #       会反过来对本服务的 yml 提要求），两条写在一起看更清楚。
    #
    #     ★★ 如果将来想「让内容服务干净地不碰 JWT」，正确做法是给
    #        ContentApplication 加排除扫描（@ComponentScan.Filter），
    #        ★ 而不是删配置 —— 只删配置的话，服务根本起不来。
    #        M2 不做这件事：M2 的目标是「业务无回归」，不是顺手改造 common。
    #
    # ★★★ 这里【故意不给默认值】★★★
    # 写 ${JWT_SECRET} 而不是 ${JWT_SECRET:某个默认密钥}，是为了让生产环境
    # 【没配就起不来】—— 直接抛占位符解析失败，一眼能看出是密钥没配。
    # 如果给了默认值，生产环境忘了配密钥时会静默用这个默认值启动，
    # 而这个默认值就写在提交到 git 的文件里 —— 等于全世界都知道你的签名密钥。
    #
    # 开发环境的默认值放在 application-dev.yml。
    secret: ${JWT_SECRET}

    # token 有效期（天）。本服务不签发 token，这个值只是为了让 JwtUtil 构造成功。
    # 它必须和网关 / novel-auth 的取值一致 —— 不一致不会报错，
    # 只会在「续期」相关的逻辑上产生难以察觉的偏差。
    expire-days: 7

  # ============================================================
  # AI 写作助手（P4）—— ★ M2 起跟着 modules/ai 一起住在本服务
  # ============================================================
rocketmq:
  # ★★ 生产【故意不写默认值】—— 和 novel.internal.token / novel.jwt.secret 同一条规矩：
  #    不配就启动失败，而不是悄悄连到开发机的 192.168.127.137。
  #    开发环境的实际值写在 application-dev.yml（那边有完整的条件说明）。
  #
  # ★ 为什么留这个占位符、而不是整段删掉：删掉的话 producer bean 根本不会创建
  #    （条件见 application-dev.yml 里那段），启动时只报
  #    「no bean of type 'RocketMQTemplate'」—— 一句看不出根因的错。
  #    留着它，报错会直接点名 ROCKETMQ_NAME_SERVER。
  name-server: ${ROCKETMQ_NAME_SERVER}

  # 生产者组：和 dev 一致 —— 它不是环境相关的配置。
  # ★ novel-auth 那边取值不同（novel-tx-audit），因为事务回查按事务组做身份。
  producer:
    group: novel-producer

# ============================================================
# MyBatis-Plus
# ============================================================
mybatis-plus:
  # XML 映射文件位置。复杂的多表关联查询写 XML，简单 CRUD 直接用 BaseMapper
  # ★ 当前项目里没有 XML（全部用注解 @Select），保留这一行是为了将来加 XML 时不用改配置。
  mapper-locations: classpath*:/mapper/**/*.xml

  # 实体类包，写 XML 的 resultType 时可以省略全限定名。
  # ★★ 这个通配三个服务【逐字相同】，却扫出不同结果 ——
  #    因为各自的 classpath 里只有自己的模块。和 @MapperScan 同一个道理，
  #    不是配置有什么玄机，所以 M2 之后也【不需要】给它们各写一份。
  type-aliases-package: com.novel.modules.**.entity

  configuration:
    map-underscore-to-camel-case: true          # create_time → createTime
    cache-enabled: false                        # 关掉二级缓存，避免多实例/集群下数据不一致
    # ★ 开发期把 SQL 打到控制台，方便对账。上线前要注释掉，否则日志会很大
    # ★★ 注意：SQL 是打到【控制台/stdout】的，不是 backend/logs/*.log。
    #    想 grep SQL 必须给 java 进程额外加 -RedirectStandardOutput。
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

  global-config:
    banner: false                               # 关掉启动时那行 MyBatis-Plus 广告
    db-config:
      id-type: auto                             # 主键自增（对应建表语句的 AUTO_INCREMENT）
      logic-delete-field: deleted               # ★ 逻辑删除字段
      logic-delete-value: 1                     # 删除 = 置 1
      logic-not-delete-value: 0                 # 未删除 = 0
      # 逻辑删除后，MyBatis-Plus 会自动给所有查询加上 WHERE deleted = 0
      # ★★ 但【手写 @Select 时它完全不生效】—— 见项目范式里的那一条。

# ============================================================
# Knife4j 接口文档
# ============================================================
knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-footer: false
    enable-open-api: false
  # ★ 生产环境要关掉：springdoc.api-docs.enabled=false
  # ★★ 网关【故意】不透传 knife4j（理由见 docs/M0-骨架搭建.md），
  #    所以文档只能直连本服务的端口看：http://localhost:8082/doc.html
  #    M2 之后有三个文档入口：8081（auth）/ 8082（content）/ 8083（interaction）。

# ============================================================
# 日志
# ============================================================
logging:
  level:
    root: info
    com.novel: debug                    # 自己写的代码开 debug，方便排查
    org.springframework.web: info
  # ★★ M5：traceId 进日志。键名必须和 TraceContext.MDC_KEY 逐字相同 ——
  #   改了一个另一个不会报错，只会永远打空（Logback 找不到键就是空字符串）。
  # ★ 字段顺序是「级别 → traceId → 线程 → logger → 消息」，即
  #   从「这条多重要」到「哪一次请求」到「谁打的」到「说了什么」。
  # ★ 非请求线程（启动日志 / MQ 消费 / 定时任务）没有 MDC，这一格显示成 [] ——
  #   那是在说「这一行不属于任何一次请求」，不是错误；
  #   反过来，一行处理请求的日志显示 [] 才值得去看。
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId}] [%thread] %logger{36} - %msg%n"
