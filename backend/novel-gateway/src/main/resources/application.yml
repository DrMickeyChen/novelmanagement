# ============================================================
# 小说管理系统 · 网关配置
# ============================================================
# 第二期 M0：网关只做「按路径转发到服务」。
# 第二期 M1：网关【多了一件正事】—— 验 JWT、查 Redis、把身份写进请求头
#            交给下游（见 gateway/filter/JwtAuthGlobalFilter）。
#            限流是 M5。
#
# ★ 路由为什么写在【本地】而不是 Nacos Config：
#    M0 要证明的是「路由能通」。引入 Nacos Config 会多出一层
#    「配置没拉到时静默用兜底值」的失败模式 —— 而那种失败看起来
#    和「路由配错了」一模一样，会把排错时间翻倍。
#    配置真的多到需要集中管理时再接，不是现在。
#
# ★★ M1 起这个文件【拆出了 application-dev.yml】，理由和另外两个服务一样：
#    M0 时网关这一层没有任何真实口令（nacos/nacos 是中间件自带的固定演示值），
#    所以一个文件就够；M1 起它要连 Redis、要验 JWT，
#    于是有了「Redis 口令 / JWT 密钥 / 服务间令牌」三样需要 dev 默认值的东西。
#    本文件保留 M0 那些【不含真实口令】的配置（端口 / Nacos / 路由 / actuator / 日志），
#    那三样放在 application-dev.yml。
# ============================================================

server:
  # ★★ 8080 是【唯一入口】，从单体手里接过来的。
  #    单体退到 8090、auth 在 8081，都不再对外。
  #
  #    ★ dev-proxy/vite.config.js 和三个前端的 request.js 都写着 8080
  #      —— 它们【一行都不用改】，因为 8080 上确实还有东西在接。
  #      这正是把网关放在 8080 而不是另开一个端口的原因。
  port: 8080

spring:
  application:
    name: novel-gateway

  # ★ 和另外两个服务一致：dev 默认值放 profile 文件（同 novel-backend 的注释）
  profiles:
    active: dev

  cloud:

    nacos:
      discovery:
        # ★ 虚拟机上的 Docker，不是 127.0.0.1 ——
        #   后端跑在 Windows 上，Nacos 跑在虚拟机里，是两个机器。
        #   同 application-dev.yml 里 MySQL/Redis 的理由。
        server-addr: 192.168.127.137:8848

        # ★ 容器里的 Nacos 开了鉴权（NACOS_AUTH_ENABLE=true）。
        #
        # ★★ username/password 必须写在 discovery 下面：
        #     Nacos 客户端【注册】和【拉配置】是两条独立的鉴权路径。
        #     只配 spring.cloud.nacos.username（那一层管的是 config）
        #     的话，症状是「配置能拉、服务注册不上」，报 403 或者
        #     客户端直接假死 —— 报错信息完全指不到配置项。
        #     这里两套都写，多两行买一个确定性。
        username: nacos
        password: nacos

        # ★★ Windows 上【必须】显式指定注册上去的 IP。
        #
        #    Nacos 客户端默认取「第一块非 loopback 网卡」的地址。
        #    装了 VMware / VirtualBox / Hyper-V / WSL 之后，那个「第一块」
        #    很可能是 192.168.56.1 这类虚拟网卡的地址 —— 单体根本不在那儿。
        #
        #    ★ 机理一句话：注册上去的 IP 就是网关接下来要连的 IP。
        #
        #    ★★ 症状要说准，否则排错方向会跑偏（实测踩出来的）：
        #       实例在 Nacos 里「有」但连不上 → 网关拿到实例再去连 → 连不上
        #                                      500 + Connection refused / timed out
        #       实例在 Nacos 里「没有」        → 网关根本没得连
        #                                      503 + No servers available for service
        #       多网卡属于第一种（500），不是 503。503 的语义是「一个实例都没有」。
        #
        #    ★ 更隐蔽的是：网关和后端在【同一台机器】时，虚拟网卡 IP 往往能连通
        #      （Tomcat 绑 0.0.0.0:8090，本机到 192.168.56.1:8090 照样通）——
        #      于是这个坑在「单机跑全部服务」的开发期可能根本不发作，
        #      等服务分散到不同机器才炸。所以这一行是【买确定性】，不是修已知故障。
        #
        #    ★ novel-backend 那边也要加同样的一行，两个服务都要。
        ip: 127.0.0.1

    gateway:
      # ============================================================
      # 路由表（M1 起是 12 条，不是 1 条）
      # ============================================================
      #
      # ★★★ 为什么 M1 要从 1 条变成 12 条：
      #
      #   `/api/admin/**` 和 `/api/reader/**` 这两个前缀【横跨两个服务】：
      #       /api/admin/users/**          → novel-auth（用户管理）
      #       /api/admin/author-applies/** → novel-auth（作者申请审核）
      #       /api/admin/dashboard         → novel-backend（数据大盘，读作品表）
      #       /api/reader/profile/**       → novel-auth（个人资料、头像）
      #       /api/reader/bookshelf        → novel-backend（书架）
      #   所以【不能】按 /api/admin/** 一刀切，必须拆到「具体前缀」这一层。
      #   下表是 grep 完两个服务的所有 @RequestMapping 之后核对的，
      #   漏一条的症状是：那个接口 404（像路径写错了）或打到了错的服务。
      #
      # ★★ order 必须【显式写死】，不依赖 YAML 里的书写顺序：
      #     路由按 order 升序匹配，取【第一个命中】的。
      #     RouteDefinition 不写 order 时默认是 0 —— 于是只要有一条忘了写，
      #     它会排在所有显式 order 的路由【前面】，把流量抢走。
      #     这里 auth 一律 1、backend 一律 10，兜底那条永远在最后。
      #
      # ★★ 每条前缀都写【裸路径 + /**】两种形状，这不是冗余：
      #     Spring 的 PathPattern 里 `/api/notices/**` 匹配
      #     `/api/notices/1`，但【不匹配】`/api/notices` 本身。
      #     而本项目的 Controller 写法不统一：
      #         ReaderNoticeController 是【方法级】@GetMapping("/api/notices")
      #            —— 没有类级前缀，路径就是裸的
      #         ReaderProfileController 是【类级】/api/reader/profile +
      #            方法级 /avatar、/password
      #            —— 于是 `GET /api/reader/profile` 是裸路径，
      #               `PUT /api/reader/profile` 也是裸路径
      #     只写 `/**` 那一种的话，这两个接口会【掉进兜底路由】被转发给
      #     novel-backend —— 而那边没有它们，结果是 404。
      #     ★ 症状是「改昵称 404、传头像却正常」，看起来像接口没实现。
      #
      # ★ uri 用 lb:// 而不是 http://localhost:8090：
      #   写死地址的话，M1 把 auth 摘出去、M2 把 content 摘出去之后，
      #   每摘一个服务都要回来改一次网关配置 —— 那正是这一期要避免的事。
      #   用服务名，网关去 Nacos 问「novel-auth 现在在哪」，
      #   服务拆几个实例、部署在哪台机器，这里都不用动。
      routes:

        # ============================================================
        # novel-auth（:8081）—— order: 1，必须排在下面那条 /api/** 之前
        # ============================================================
        # ★ 这 10 条是「M1 从单体里摘走的那部分」的全部对外路径。
        #   核对方法（加接口时照着做一遍）：
        #     grep -rn "@RequestMapping\|@GetMapping\|@PostMapping\|@PutMapping\|@DeleteMapping" \
        #       backend/novel-auth/src/main/java/com/novel/modules/system/controller/

        # --- 登录 / 注册 / 登出 / 当前用户 ---
        - id: auth-auth
          uri: lb://novel-auth
          order: 1
          predicates:
            - Path=/api/auth,/api/auth/**

        # --- 健康检查（PingController：/、/db、/redis）---
        - id: auth-ping
          uri: lb://novel-auth
          order: 1
          predicates:
            - Path=/api/ping,/api/ping/**

        # --- 读者端公告横幅（★ 方法级映射，路径是裸的）---
        - id: auth-notices
          uri: lb://novel-auth
          order: 1
          predicates:
            - Path=/api/notices,/api/notices/**

        # --- 读者端个人资料：GET/PUT 裸路径 + POST /avatar、PUT /password ---
        - id: auth-reader-profile
          uri: lb://novel-auth
          order: 1
          predicates:
            - Path=/api/reader/profile,/api/reader/profile/**

        # --- 读者端「申请成为作者」：POST 裸路径 + GET /mine ---
        - id: auth-reader-author-apply
          uri: lb://novel-auth
          order: 1
          predicates:
            - Path=/api/reader/author-apply,/api/reader/author-apply/**

        # --- 管理端：用户管理 ---
        - id: auth-admin-users
          uri: lb://novel-auth
          order: 1
          predicates:
            - Path=/api/admin/users,/api/admin/users/**

        # --- 管理端：角色 + 赋权 ---
        - id: auth-admin-roles
          uri: lb://novel-auth
          order: 1
          predicates:
            - Path=/api/admin/roles,/api/admin/roles/**

        # --- 管理端：菜单树 ---
        - id: auth-admin-menus
          uri: lb://novel-auth
          order: 1
          predicates:
            - Path=/api/admin/menus,/api/admin/menus/**

        # --- 管理端：公告增删改查 ---
        - id: auth-admin-notices
          uri: lb://novel-auth
          order: 1
          predicates:
            - Path=/api/admin/notices,/api/admin/notices/**

        # --- 管理端：作者申请审核 ---
        - id: auth-admin-author-applies
          uri: lb://novel-auth
          order: 1
          predicates:
            - Path=/api/admin/author-applies,/api/admin/author-applies/**

        # ============================================================
        # novel-backend（:8090）—— order: 10，兜底
        # ============================================================
        # ★★ 这两条【必须排在最后】。上面 10 条没命中的 /api/** 全部落到这里，
        #    所以任何「本该属于 auth 但前缀没列全」的接口都会被静默转发到
        #    novel-backend，然后在那边 404 ——
        #    看起来像「接口不存在」，而不是「网关路由漏了一条」。
        #
        # ★ 判定性验证（比逐条 curl 更能说明问题）：
        #    停掉 novel-backend → auth 的路径【仍然活着】、backend 的路径 503。
        #    两条同时成立，才证明这 12 条路由真的分开了。

        # --- 内容 / 互动 / AI / 搜索（作品、章节、评论、书架、AI、大盘）---
        - id: backend-api
          uri: lb://novel-backend
          order: 10
          predicates:
            - Path=/api/**

        # ------------------------------------------------------------
        # 上传的静态文件（作品封面、用户头像）
        # ------------------------------------------------------------
        # ★ 这条必须单独有：/uploads/** 不在 /api/** 里，
        #   但它同样由 novel-backend 提供（WebMvcConfig 把它们映射到磁盘目录）。
        #   漏了这条的症状是「接口全好，只有图片 404」——
        #   而 404 又是「图片不存在」的常见表现，很容易往错的方向查。
        #
        # ★★ M1 的一条已知债：头像文件其实是 novel-auth 写的
        #    （POST /api/reader/profile/avatar），但读由 novel-backend 服。
        #    开发期两个服务在同一台机器、用同一条绝对路径
        #    （novel.upload.path），所以成立。
        #    生产上两个容器各有文件系统 → 头像写进了 auth 的盘、
        #    backend 去找 → 404。解法在 M5（接 MinIO/OSS）。
        #    ★ 不给 auth 也加一条 /uploads/** 路由 —— 那只会掩盖问题：
        #      两个服务各自服自己盘上的文件，看起来「有时能显示有时不能」，
        #      比一直 404 更难查。
        - id: backend-uploads
          uri: lb://novel-backend
          order: 10
          predicates:
            - Path=/uploads/**

        # ------------------------------------------------------------
        # ★ 为什么【没有】/doc.html 的路由 —— 这是有意的
        # ------------------------------------------------------------
        # 接口文档直连 http://localhost:8090/doc.html，不走网关。
        #
        # /doc.html 不是一个独立的页面：它加载后会再去拉
        # /webjars/**（前端资源）和 /v3/api-docs/**（接口清单）。
        # 要透传就得给这一整套加路由，还要处理 X-Forwarded-* 头
        # 和 springdoc 的 server 地址推断 —— 是一件独立的、
        # 会把 M0 拖长的活，而且和 M0 的验收标准（路由通 + Nacos 可见）无关。
        #
        # 记在「按需」里。这是开发期唯一一个不走 :3000 的入口。

# ============================================================
# JWT / 内部令牌（M1 新增）
# ============================================================
# ★★ 这两个键【故意不给默认值】，和 novel-auth / novel-backend 的
#    application.yml 里那两处是同一个写法：
#    生产环境没配 JWT_SECRET / INTERNAL_TOKEN 就【起不来】，
#    而不是静默用一个写死在 git 里的弱值跑起来。
#
# ★ 为什么网关这一侧尤其不能给默认值：
#    jwt.secret 错了 → 它验不出任何 token → 全站被当成匿名 → 全站 401。
#    这个症状【非常响亮】，一定会被发现。
#    而 internal.token 错了 → 下游 HeaderAuthenticationFilter 认为
#    「这些身份头是有人伪造的」，把整个请求按匿名处理 ——
#    症状同样是全站 401，但它看起来会像「网关没把身份头写过去」，
#    排错方向会跑到 JwtAuthGlobalFilter 上去，而真正的原因是配置。
#
# 开发环境的默认值在 application-dev.yml。
novel:
  jwt:
    secret: ${JWT_SECRET}
    # ★ 本服务【不签发】token，这个值只被 JwtUtil 的构造器要求存在。
    #   配错不会导致任何功能异常（网关只读 secret 去验签），
    #   但和 auth 不一致会让读配置的人困惑，所以照抄同一个值。
    expire-days: 7

  internal:
    token: ${INTERNAL_TOKEN}

# ============================================================
# 健康检查 / 路由自检
# ============================================================
management:

  endpoint:
    health:
      show-details: always

    # ★★ 这两行【都要】，少一行 /actuator/gateway/routes 就是 404。
    #
    #    它们管的是两件不同的事，缺哪一个的症状一模一样（都是 404）：
    #
    #      endpoint.gateway.enabled    端点本身要不要【被创建】
    #      endpoints.web.exposure...   创建出来之后要不要【从 HTTP 暴露出去】
    #
    #    ★ Spring Cloud Gateway 的 actuator 端点默认是 enabled: false
    #      （和 health / info 那些不一样，它们是默认开的）。
    #      这是实测踩出来的：只写了下面 exposure 那一行，
    #      /actuator 的列表里只有 health / info / self —— gateway
    #      端点压根没被创建，所以 404 的原因在【上面】这一行，
    #      不在 expose 上。
    gateway:
      enabled: true

  endpoints:
    web:
      exposure:
        include: health,info,gateway

# ============================================================
# 日志
# ============================================================
logging:

  # ★ 和单体一样落一份文件，理由也一样：网关是用 Start-Process 隐藏窗口起的，
  #   控制台看不到；而排障时最需要翻的恰恰是它的历史输出 ——
  #   比如「No servers available for service: novel-backend」（503 的真因）、
  #   「Unable to find instance for novel-backend」。这些只在日志里有。
  #
  # ★ 路径是相对的，落点 = 进程的工作目录。启动时 -WorkingDirectory 用 backend/，
  #   所以是 backend/logs/novel-gateway.log，和单体的 novel-backend.log 并排。
  #   改成 backend/novel-gateway/ 的话日志会静默换地方。
  #
  # ★ 单体把这一段放在 application-dev.yml（生产走 stdout 交给采集器）。
  #   网关这里【暂时】还放在 application.yml，所以网关在生产会往工作目录写日志文件。
  #   ★ M1 起网关已经有 application-dev.yml 了（装 Redis 口令 / JWT 密钥 / 共享令牌），
  #     所以当初「只有一个 profile、没地方放」的理由已经不成立 ——
  #     现在留在原地的唯一理由是「挪它 = 改生产行为」，而那件事归 M5 做生产部署时一并处理。
  #     看到这一段别以为是漏搬：它是有意留的，`docs/部署.md` 里也写了。
  file:
    name: logs/novel-gateway.log

  level:
    # ★ 这几行是 M0 排障的主角：路由匹配、负载均衡选实例、转发失败都打在这里。
    #   网关自身的日志量很小（它一个业务查询都没有），开 debug 不心疼。
    com.novel.gateway: debug
    org.springframework.cloud.gateway: info
    org.springframework.cloud.loadbalancer: debug

  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
