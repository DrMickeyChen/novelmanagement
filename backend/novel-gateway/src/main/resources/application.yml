# ============================================================
# 小说管理系统 · 网关配置
# ============================================================
# 第二期 M0：网关只做「按路径转发到服务」。
# 第二期 M1：网关【多了一件正事】—— 验 JWT、查 Redis、把身份写进请求头
#            交给下游（见 gateway/filter/JwtAuthGlobalFilter）。
#            限流是 M5。
#
# ★ 路由为什么写在【本地】而不是 Nacos Config：
#    M0 要证明的是「路由能通」。引入 Nacos Config 会多出一层
#    「配置没拉到时静默用兜底值」的失败模式 —— 而那种失败看起来
#    和「路由配错了」一模一样，会把排错时间翻倍。
#    配置真的多到需要集中管理时再接，不是现在。
#
# ★★ M1 起这个文件【拆出了 application-dev.yml】，理由和另外两个服务一样：
#    M0 时网关这一层没有任何真实口令（nacos/nacos 是中间件自带的固定演示值），
#    所以一个文件就够；M1 起它要连 Redis、要验 JWT，
#    于是有了「Redis 口令 / JWT 密钥 / 服务间令牌」三样需要 dev 默认值的东西。
#    本文件保留 M0 那些【不含真实口令】的配置（端口 / Nacos / 路由 / actuator / 日志），
#    那三样放在 application-dev.yml。
# ============================================================

server:
  # ★★ 8080 是【唯一入口】，从单体手里接过来的。
  #    ★ M2 起的拓扑：网关 8080 → auth 8081 / content 8082 / interaction 8083，
  #      三个后端服务全部退到内网，都不再对外。
  #
  #    ★ dev-proxy/vite.config.js 和三个前端的 request.js 都写着 8080
  #      —— 它们【一行都不用改】，因为 8080 上确实还有东西在接。
  #      这正是把网关放在 8080 而不是另开一个端口的原因。
  port: 8080

spring:
  application:
    name: novel-gateway

  # ★ 和另外三个服务一致：dev 默认值放 profile 文件（同 novel-interaction 的注释）
  profiles:
    active: dev

  cloud:

    nacos:
      discovery:
        # ★ 虚拟机上的 Docker，不是 127.0.0.1 ——
        #   后端跑在 Windows 上，Nacos 跑在虚拟机里，是两个机器。
        #   同 application-dev.yml 里 MySQL/Redis 的理由。
        server-addr: 192.168.127.137:8848

        # ★ 容器里的 Nacos 开了鉴权（NACOS_AUTH_ENABLE=true）。
        #
        # ★★ username/password 必须写在 discovery 下面：
        #     Nacos 客户端【注册】和【拉配置】是两条独立的鉴权路径。
        #     只配 spring.cloud.nacos.username（那一层管的是 config）
        #     的话，症状是「配置能拉、服务注册不上」，报 403 或者
        #     客户端直接假死 —— 报错信息完全指不到配置项。
        #     这里两套都写，多两行买一个确定性。
        username: nacos
        password: nacos

        # ★★ Windows 上【必须】显式指定注册上去的 IP。
        #
        #    Nacos 客户端默认取「第一块非 loopback 网卡」的地址。
        #    装了 VMware / VirtualBox / Hyper-V / WSL 之后，那个「第一块」
        #    很可能是 192.168.56.1 这类虚拟网卡的地址 —— 单体根本不在那儿。
        #
        #    ★ 机理一句话：注册上去的 IP 就是网关接下来要连的 IP。
        #
        #    ★★ 症状要说准，否则排错方向会跑偏（实测踩出来的）：
        #       实例在 Nacos 里「有」但连不上 → 网关拿到实例再去连 → 连不上
        #                                      500 + Connection refused / timed out
        #       实例在 Nacos 里「没有」        → 网关根本没得连
        #                                      503 + No servers available for service
        #       多网卡属于第一种（500），不是 503。503 的语义是「一个实例都没有」。
        #
        #    ★ 更隐蔽的是：网关和后端在【同一台机器】时，虚拟网卡 IP 往往能连通
        #      （Tomcat 绑 0.0.0.0:8083，本机到 192.168.56.1:8083 照样通）——
        #      于是这个坑在「单机跑全部服务」的开发期可能根本不发作，
        #      等服务分散到不同机器才炸。所以这一行是【买确定性】，不是修已知故障。
        #
        #    ★ 另外三个服务（auth / content / interaction）都加了同样的一行。
        ip: 127.0.0.1

    gateway:
      # ============================================================
      # 路由表（M2 起是 19 条，横跨三个服务）
      # ============================================================
      #
      # ★★★ 为什么路由表长这样（从 M0 的 1 条 → M1 的 12 条 → M2 的 19 条）：
      #
      #   M1 把 auth 摘出去时，问题是「/api/admin/** 和 /api/reader/** 横跨两个服务」；
      #   M2 把 content 摘出去之后，这个问题的规模又大了一圈 ——
      #   现在是【三个共享前缀】横跨三个服务：
      #
      #       /api/novels/**  → content 有 7 条（正文/目录/排行/浏览数）
      #                         interaction 有 3 条（书评、章评、回复）
      #       /api/admin/**   → auth 有 5 个前缀，content 有 5 个，interaction 有 1 个
      #       /api/reader/**  → auth 有 2 个前缀（profile / author-apply）
      #                         interaction 有 2 个（shelf / history）
      #
      #   所以【不能】按前缀一刀切，必须拆到「能把它和同前缀的兄弟区分开」
      #   这一层。下表是 grep 完三个服务的所有 @RequestMapping + 方法级路径
      #   之后逐条核对的，漏一条的症状是：那个接口 404（像路径写错了）
      #   或打到了错的服务。
      #
      # ★★★ 【不变式】任何与 content 的 /api/novels/** 或 /api/admin/** 重叠的
      #     【其它服务】路由，order 必须【严格小于】content 的 5。
      #     ★ M2 写这条时它只适用于 interaction 一家（4 < 5）；
      #       M4 摘出 search 之后有了【第二个】适用者 —— search 的
      #       /api/search 与 /api/admin/search/** 同样压在 content 的前缀底下，
      #       同样靠 order 3 < 5 抢下来。
      #     ★★ 判据要按【形状】记，不要按服务名记（"interaction 要在 content 前面"
      #        这种写法，加第三个服务时就得重新推导一遍）：
      #        「与 content 的具体前缀重叠 ⇒ order 必须严格小于 5」。
      #     理由见下面 order 那一段。
      #
      # ★★ order 必须【显式写死】，不依赖 YAML 里的书写顺序：
      #     路由按 order 升序匹配，取【第一个命中】的。
      #     RouteDefinition 不写 order 时默认是 0 —— 于是只要有一条忘了写，
      #     它会排在所有显式 order 的路由【前面】，把流量抢走。
      #
      #     ★★★ M2 起的分段：【1】auth 具体前缀 →【3】search 抢占
      #         →【4】interaction 抢占 →【5】content 具体前缀
      #         →【10】/uploads/** →【20】兜底。
      #     ★ M4 把 search 放在 3 而不是和 interaction 一样用 4：两者并不重叠，
      #       同序其实"能用"，但那会重新引入「同序内部顺序无保证」这个隐患 ——
      #       而它恰恰是 M2 花力气挪兜底（10 → 20）时消掉的那个。
      #       ★★ 「同序碰巧没事」不是设计，是运气；运气在下一次加路由时就会用完。
      #     为什么要给兜底留出 1~19 这一整段：order 相同时 Spring Cloud Gateway
      #     的命中顺序【没有保证】（它按 order 排序，但同序内部不可依赖）。
      #     M1 时兜底是 10、具体路由是 1，看似够用；M2 一下子加了 7 条具体路由，
      #     任何两条打平都会变成「有时走对了、有时 404」这种最难查的故障。
      #     挪到 20 之后，具体路由有 1~19 可以自由分配，永远不会和兜底打平。
      #     ★ 症状对照：content 的路由被兜底吞掉的表象是【静默 404】，
      #       看起来完全像「这个接口没实现」。
      #
      # ★★ 每条前缀都写【裸路径 + /**】两种形状，这不是冗余：
      #     Spring 的 PathPattern 里 `/api/notices/**` 匹配
      #     `/api/notices/1`，但【不匹配】`/api/notices` 本身。
      #     而本项目的 Controller 写法不统一：
      #         ReaderNoticeController 是【方法级】@GetMapping("/api/notices")
      #            —— 没有类级前缀，路径就是裸的
      #         ReaderProfileController 是【类级】/api/reader/profile +
      #            方法级 /avatar、/password
      #            —— 于是 `GET /api/reader/profile` 是裸路径
      #     M2 又添了三个同样形状的：`/api/novels`、`/api/categories`、`/api/author/novels`。
      #     只写 `/**` 那一种的话，这些接口会【掉进兜底路由】被转发给
      #     novel-interaction —— 而那边没有它们，结果是 404。
      #     ★ 症状是「改昵称 404、传头像却正常」，看起来像接口没实现。
      #
      # ★ uri 用 lb:// 而不是 http://localhost:8083：
      #   写死地址的话，M1 摘 auth、M2 摘 content 之后，
      #   每摘一个服务都要回来改一次网关配置 —— 那正是这几期要避免的事。
      #   用服务名，网关去 Nacos 问「novel-content 现在在哪」，
      #   服务拆几个实例、部署在哪台机器，这里都不用动。
      #
      # ★★ M2 起有【四】个服务名必须和各自的 spring.application.name 逐字相同：
      #   lb://novel-auth / lb://novel-content / lb://novel-interaction / lb://novel-search。
      #   写错的症状是 `Unable to find instance for novel-xxx`（503），
      #   而它【不会】在启动时报错 —— 要等第一次请求。
      routes:

        # ============================================================
        # 一、novel-auth（:8081）—— order: 1，必须排在下面所有路由之前
        # ============================================================
        # ★ 这 10 条是「M1 从单体里摘走的那部分」的全部对外路径，M2 一字未动。
        #   核对方法（加接口时照着做一遍）：
        #     grep -rn "@RequestMapping\|@GetMapping\|@PostMapping\|@PutMapping\|@DeleteMapping" \
        #       backend/novel-auth/src/main/java/com/novel/modules/system/controller/

        # --- 登录 / 注册 / 登出 / 当前用户 ---
        - id: auth-auth
          uri: lb://novel-auth
          order: 1
          predicates:
            - Path=/api/auth,/api/auth/**

        # --- 健康检查（PingController：/、/db、/redis）---
        - id: auth-ping
          uri: lb://novel-auth
          order: 1
          predicates:
            - Path=/api/ping,/api/ping/**

        # --- 读者端公告横幅（★ 方法级映射，路径是裸的）---
        - id: auth-notices
          uri: lb://novel-auth
          order: 1
          predicates:
            - Path=/api/notices,/api/notices/**

        # --- 读者端个人资料：GET/PUT 裸路径 + POST /avatar、PUT /password ---
        - id: auth-reader-profile
          uri: lb://novel-auth
          order: 1
          predicates:
            - Path=/api/reader/profile,/api/reader/profile/**

        # --- 读者端「申请成为作者」：POST 裸路径 + GET /mine ---
        - id: auth-reader-author-apply
          uri: lb://novel-auth
          order: 1
          predicates:
            - Path=/api/reader/author-apply,/api/reader/author-apply/**

        # --- 管理端：用户管理 ---
        - id: auth-admin-users
          uri: lb://novel-auth
          order: 1
          predicates:
            - Path=/api/admin/users,/api/admin/users/**

        # --- 管理端：角色 + 赋权 ---
        - id: auth-admin-roles
          uri: lb://novel-auth
          order: 1
          predicates:
            - Path=/api/admin/roles,/api/admin/roles/**

        # --- 管理端：菜单树 ---
        - id: auth-admin-menus
          uri: lb://novel-auth
          order: 1
          predicates:
            - Path=/api/admin/menus,/api/admin/menus/**

        # --- 管理端：公告增删改查 ---
        - id: auth-admin-notices
          uri: lb://novel-auth
          order: 1
          predicates:
            - Path=/api/admin/notices,/api/admin/notices/**

        # --- 管理端：作者申请审核 ---
        - id: auth-admin-author-applies
          uri: lb://novel-auth
          order: 1
          predicates:
            - Path=/api/admin/author-applies,/api/admin/author-applies/**

        # ============================================================
        # 二、novel-search（:8084）【抢占】—— order: 3
        #     必须严格小于下面 content 的 order: 5
        # ============================================================
        #
        # ★★★ M4 新增。它和 interaction 那三条属于【同一类】：都在抢 content 的前缀。
        #
        #   重叠点有两个，而这两个的性质并不一样，别合并成一句话：
        #
        #     /api/search        —— content 的 content-misc 里【曾经】也写着它。
        #                           M4 已把那一段从 content-misc 里删掉，
        #                           所以这条现在是【独占】而不是抢占。
        #                           ★ 但 order 仍必须 < 5：万一漏删了 content-misc 那一段，
        #                             两条路由会同时命中，3 赢 5 ——
        #                             于是【症状消失、而配置是错的】，
        #                             要等下次有人把这里改成 order: 6 才会爆出来。
        #
        #     /api/admin/search  —— content 的 /api/admin/** 天然覆盖它，
        #                           这条是【真·抢占】，和 interaction 的
        #                           /api/admin/comments 一模一样。
        #
        # ★★ 三种漏法的症状完全相同（都是 404），所以必须【同一个原子步骤】改完：
        #     ① content-misc 里没删 /api/search    → 老路由把请求转给 content，
        #        而 ReaderSearchController 已经搬走了 → 404
        #     ② /api/admin/search 忘了加 / order ≥ 5 → 被 content 的
        #        /api/admin/** 抢走 → 404
        #     ③ 只写 /api/search/** 不写裸路径      → 裸路径掉进 order 20 的兜底
        #        （interaction）→ 404
        #
        # ★★★ 判定性验证（一次就够，别逐条 curl）：
        #     停掉 novel-search → /api/search 系列【全部非 2xx】，
        #                         /api/novels 仍然【200】。
        #     ★ 两条【同时】成立才有信息量：只看前面那条的话，网关整个挂了也一样。
        #     ★★ 再分别打 /api/search 与 /api/search/ 各一次 —— 这是第 ③ 条的专用探针
        #        （裸路径和带斜杠是两种不同的 PathPattern 形状）。
        #
        # ★★★ 已实测（S9）：那个状态码是【500】，不是 503 —— 别按 503 去验。
        #     停进程之后 Nacos 摘除是滞后的，实例还挂在注册表里 → 网关照样去连 →
        #     `Connection refused: /127.0.0.1:8084` 被 AbstractErrorWebExceptionHandler 兜成 500。
        #     ★ 这与本文件开头「实例在 Nacos 里【有】但连不上 → 500」那条辨析是同一件事
        #       （503 的语义是「一个实例都没有」，停一个进程到不了那个状态）。
        #     ★★ 所以判据要写成「非 2xx」，不要写死 503 ——
        #       写死 503 的话，下一个人跑出 500 会去查「路由是不是没配好」，方向直接跑偏。
        #     ★ 实测还顺带闭掉了第 ③ 条：/api/search/ 与裸路径【同生共死】（一起 500）。
        #       若带斜杠那条掉进了 order 20 的兜底，停 novel-search 它不会有任何变化
        #       （interaction 活着）—— 它跟着变，说明 /api/search/** 确实吃掉了它。

        - id: search-query
          uri: lb://novel-search
          order: 3
          predicates:
            - Path=/api/search,/api/search/**

        - id: search-admin
          uri: lb://novel-search
          order: 3
          predicates:
            - Path=/api/admin/search,/api/admin/search/**

        # ============================================================
        # 三、novel-interaction（:8083）【抢占】—— order: 4
        #     必须严格小于下面 content 的 order: 5
        # ============================================================
        #
        # ★★★ 这一节是 M2 路由表里最容易写错的地方，没有之一。
        #
        #   矛盾点：content 和 interaction 都想住 /api/novels/**。
        #   唯一的区分特征是【末尾多一段 comments】：
        #
        #       GET /api/novels/1/chapters/1            → content（章节正文）
        #       GET /api/novels/1/chapters/1/comments   → interaction（章评）
        #                                      ^^^^^^^^ 只有这一点不同
        #
        #   所以 interaction 这三条必须在 content 的 /api/novels/** 之前命中。
        #   少任何一条的症状都是「那一类评论接口 404」，而且形状和正文接口
        #   极像，排查时很容易以为是接口没实现。
        #
        # ★ 判定性验证（比逐条 curl 更能说明问题）：
        #     GET /api/novels/1/chapters/1           → 200（走 content）
        #     GET /api/novels/1/chapters/1/comments  → 200（走 interaction）
        #   两条同时成立，才证明这两条规则的先后真的生效了。

        # --- 书评列表（GET）/ 发表书评（POST）/ 回复列表（GET /{c}/replies）---
        #   ★ 裸路径和 /** 两种形状都要：
        #     `/api/novels/*/comments`       ← GET/POST 裸路径
        #     `/api/novels/*/comments/**`    ← GET /{commentId}/replies
        - id: interaction-novel-comments
          uri: lb://novel-interaction
          order: 4
          predicates:
            - Path=/api/novels/*/comments,/api/novels/*/comments/**

        # --- 章评列表（GET）/ 发表章评（POST）---
        #   ★ 这一条是「形状最像 content」的那一条，单独列出来是为了
        #     让它在 diff 里一眼可见 —— 它和 content 的
        #     `/api/novels/*/chapters/*` 只差最后一段。
        - id: interaction-novel-chapter-comments
          uri: lb://novel-interaction
          order: 4
          predicates:
            - Path=/api/novels/*/chapters/*/comments

        # --- 管理端：评论管理（列表 / 审核 / 删除）---
        #   ★ 与 content 的 /api/admin/** 重叠，同样靠 order 4 < 5 抢下来。
        - id: interaction-admin-comments
          uri: lb://novel-interaction
          order: 4
          predicates:
            - Path=/api/admin/comments,/api/admin/comments/**

        # ============================================================
        # 四、novel-content（:8082）—— order: 5
        # ============================================================
        # ★★ 这里【必须】排在 interaction 那三条之后（5 > 4）。
        #    反过来的话 interaction 的评论接口会全部落到 content → 404。
        #
        # ★★ 为什么 content 用一条 `/api/novels/**` 兜住、而不是像 auth 那样
        #    逐条列前缀：因为 content 是 /api/novels/** 的【主要占用者】
        #    （7 条 vs 3 条），而且它占的是「除评论外的一切」——
        #    逐条列反而更容易漏。interaction 那三条是【例外】，
        #    例外用更小的 order 显式列出，这是更不容易写错的形状。

        # --- 作品 / 章节 / 目录 / 排行 / 浏览数 ---
        #   ★ 裸路径 /api/novels 必须有：NovelController 是类级
        #     @RequestMapping("/api/novels") + 方法级 @GetMapping("")。
        - id: content-novels
          uri: lb://novel-content
          order: 5
          predicates:
            - Path=/api/novels,/api/novels/**

        # --- 创作中心：我的作品 / 章节 / 大纲 / 上传封面 ---
        #   ★ /api/author/** 是 content 独占的（interaction 一条都没有），
        #     所以这里可以放心用 /**。
        - id: content-author
          uri: lb://novel-content
          order: 5
          predicates:
            - Path=/api/author,/api/author/**

        # --- 管理端：作品 / 章节 / 分类 / 审核日志 / 数据大盘 ---
        #   ★ 写成 /api/admin/** 一条通吃是安全的：auth 那 5 个前缀
        #     在 order 1 已经先命中，interaction 的 /api/admin/comments
        #     在 order 4 已经先命中，剩下的 /api/admin/** 本来就全归 content。
        #   ★★ 这个「先命中」依赖 order 1 < 5 和 4 < 5，别改。
        - id: content-admin
          uri: lb://novel-content
          order: 5
          predicates:
            - Path=/api/admin,/api/admin/**

        # --- 分类树 / AI 创作助手（含 SSE 流式）---
        #   ★ /api/categories 是方法级裸路径（同 /api/notices 那个坑）。
        #   ★★ /api/ai/** 是 SSE 流式输出，M2 起多了一跳（网关 → content）。
        #      流式要真的逐块到达才算通过，不能只看「最后整体返回了」——
        #      网关默认会缓冲响应体的话，症状是「AI 面板转很久然后一次性吐出全文」。
        #   ★★★ M4：`/api/search` 已从这一行【删掉】，搜索改由 order 3 的
        #      search-query 转给 novel-search（见上面第二节）。
        #      ★ 这一行和「删掉 ReaderSearchController」是【同一个原子步骤】：
        #        只删 Controller 不删这一行，请求会被转到 content 上一个
        #        已经不存在的接口 → 404，而它看起来像「网关路由写错了」。
        - id: content-misc
          uri: lb://novel-content
          order: 5
          predicates:
            - Path=/api/categories,/api/ai,/api/ai/**

        # ============================================================
        # 五、上传的静态文件（作品封面、用户头像）—— order: 10
        # ============================================================
        # ★ 这条必须单独有：/uploads/** 不在 /api/** 里。
        #   它由 novel-common 的 WebMvcConfig 映射到磁盘目录，
        #   而那个类是 common 的，【三个服务都扫得到】——
        #   所以谁服这条路由都行，这里指给 novel-interaction。
        #   漏了这条的症状是「接口全好，只有图片 404」——
        #   而 404 又是「图片不存在」的常见表现，很容易往错的方向查。
        #
        # ★★ M1 的一条已知债（M2 沿记录）：头像文件其实是 novel-auth 写的
        #    （POST /api/reader/profile/avatar），封面是 novel-content 写的，
        #    但读由 novel-interaction 服。
        #    开发期三个服务在同一台机器、用同一条绝对路径
        #    （novel.upload.path），所以成立。
        #    生产上三个容器各有文件系统 → 各自找到的文件不一样。
        #    解法在 M5（接 MinIO/OSS）。
        #    ★ 不给 auth / content 也各加一条 /uploads/** 路由 —— 那只会掩盖问题：
        #      三个服务各自服自己盘上的文件，看起来「有时能显示有时不能」，
        #      比一直 404 更难查。
        - id: backend-uploads
          uri: lb://novel-interaction
          order: 10
          predicates:
            - Path=/uploads/**

        # ============================================================
        # 六、兜底 —— order: 20（★ M2 从 10 挪到 20）
        # ============================================================
        # ★★ 这一条【必须排在最后】。上面没命中的 /api/** 全部落到这里。
        #
        # ★★ 为什么是 20 而不是 M1 的 10：见本段开头那条不变式的说明 ——
        #    order 打平之后命中顺序不可依赖，而 M2 一口气加了 7 条具体路由。
        #    留出 1~19 这一整段，「新增具体路由」就永远不需要动兜底。
        #
        # ★ 落在这里的是哪些接口 —— 这个清单是【有意为空】的核对项：
        #     /api/reader/shelf/**     （interaction，order 5 里没有它）
        #     /api/reader/history/**   （interaction，同理）
        #   也就是说 interaction 的读者端接口【靠兜底命中】，
        #   这不是漏配。★ 写下来是为了让后人知道：
        #   它们没有具体路由，不是忘了加。
        #   ★ 另外，auth 的 /api/reader/profile/** 和 /api/reader/author-apply/**
        #     在 order 1 已经先命中，不会掉到这里。
        #
        # ★ 判定性验证（比逐条 curl 更能说明问题）：
        #    停掉 novel-content → content 的路径 503、interaction 的路径【仍然 200】。
        #      · GET /api/novels/1            → 503
        #      · GET /api/novels/1/comments   → 200  ← 证明这两个服务真的分开了
        #    两条同时成立，才证明这 19 条路由真的分开了。
        - id: interaction-api
          uri: lb://novel-interaction
          order: 20
          predicates:
            - Path=/api/**

        # ------------------------------------------------------------
        # ★ 为什么【没有】/doc.html 的路由 —— 这是有意的
        # ------------------------------------------------------------
        # 接口文档直连，不走网关。★ M2 起有【三个】入口：
        #   http://localhost:8081/doc.html   （novel-auth）
        #   http://localhost:8082/doc.html   （novel-content）
        #   http://localhost:8083/doc.html   （novel-interaction）
        #
        # /doc.html 不是一个独立的页面：它加载后会再去拉
        # /webjars/**（前端资源）和 /v3/api-docs/**（接口清单）。
        # 要透传就得给这一整套加路由，还要处理 X-Forwarded-* 头
        # 和 springdoc 的 server 地址推断 —— 是一件独立的、
        # 会把 M0 拖长的活，而且和 M0 的验收标准（路由通 + Nacos 可见）无关。
        #
        # 记在「按需」里。这是开发期唯一不走 :3000 的入口。
        # ★ 更彻底的做法是 knife4j 的网关聚合（一个入口看三个服务的文档），
        #   M0/M1/M2 三期都推迟，继续记着。

# ============================================================
# JWT / 内部令牌（M1 新增）
# ============================================================
# ★★ 这两个键【故意不给默认值】，和 novel-auth / novel-content /
#    novel-interaction 的 application.yml 里那几处是同一个写法：
#    生产环境没配 JWT_SECRET / INTERNAL_TOKEN 就【起不来】，
#    而不是静默用一个写死在 git 里的弱值跑起来。
#
# ★ 为什么网关这一侧尤其不能给默认值：
#    jwt.secret 错了 → 它验不出任何 token → 全站被当成匿名 → 全站 401。
#    这个症状【非常响亮】，一定会被发现。
#    而 internal.token 错了 → 下游 HeaderAuthenticationFilter 认为
#    「这些身份头是有人伪造的」，把整个请求按匿名处理 ——
#    症状同样是全站 401，但它看起来会像「网关没把身份头写过去」，
#    排错方向会跑到 JwtAuthGlobalFilter 上去，而真正的原因是配置。
#
# 开发环境的默认值在 application-dev.yml。
novel:
  jwt:
    secret: ${JWT_SECRET}
    # ★ 本服务【不签发】token，这个值只被 JwtUtil 的构造器要求存在。
    #   配错不会导致任何功能异常（网关只读 secret 去验签），
    #   但和 auth 不一致会让读配置的人困惑，所以照抄同一个值。
    expire-days: 7

  internal:
    token: ${INTERNAL_TOKEN}

# ============================================================
# 健康检查 / 路由自检
# ============================================================
management:

  endpoint:
    health:
      show-details: always

    # ★★ 这两行【都要】，少一行 /actuator/gateway/routes 就是 404。
    #
    #    它们管的是两件不同的事，缺哪一个的症状一模一样（都是 404）：
    #
    #      endpoint.gateway.enabled    端点本身要不要【被创建】
    #      endpoints.web.exposure...   创建出来之后要不要【从 HTTP 暴露出去】
    #
    #    ★ Spring Cloud Gateway 的 actuator 端点默认是 enabled: false
    #      （和 health / info 那些不一样，它们是默认开的）。
    #      这是实测踩出来的：只写了下面 exposure 那一行，
    #      /actuator 的列表里只有 health / info / self —— gateway
    #      端点压根没被创建，所以 404 的原因在【上面】这一行，
    #      不在 expose 上。
    gateway:
      enabled: true

  endpoints:
    web:
      exposure:
        include: health,info,gateway

# ============================================================
# 日志
# ============================================================
logging:

  # ★ 和单体一样落一份文件，理由也一样：网关是用 Start-Process 隐藏窗口起的，
  #   控制台看不到；而排障时最需要翻的恰恰是它的历史输出 ——
  #   比如「No servers available for service: novel-content」（503 的真因）、
  #   「Unable to find instance for novel-interaction」。这些只在日志里有。
  #
  # ★ 路径是相对的，落点 = 进程的工作目录。启动时 -WorkingDirectory 用 backend/，
  #   所以是 backend/logs/novel-gateway.log，和三个服务的日志并排。
  #   改成 backend/novel-gateway/ 的话日志会静默换地方。
  #
  # ★ 单体把这一段放在 application-dev.yml（生产走 stdout 交给采集器）。
  #   网关这里【暂时】还放在 application.yml，所以网关在生产会往工作目录写日志文件。
  #   ★ M1 起网关已经有 application-dev.yml 了（装 Redis 口令 / JWT 密钥 / 共享令牌），
  #     所以当初「只有一个 profile、没地方放」的理由已经不成立 ——
  #     现在留在原地的唯一理由是「挪它 = 改生产行为」，而那件事归 M5 做生产部署时一并处理。
  #     看到这一段别以为是漏搬：它是有意留的，`docs/部署.md` 里也写了。
  file:
    name: logs/novel-gateway.log

  level:
    # ★ 这几行是 M0 排障的主角：路由匹配、负载均衡选实例、转发失败都打在这里。
    #   网关自身的日志量很小（它一个业务查询都没有），开 debug 不心疼。
    com.novel.gateway: debug
    org.springframework.cloud.gateway: info
    org.springframework.cloud.loadbalancer: debug

  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
