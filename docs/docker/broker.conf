# ============================================================
# RocketMQ Broker 配置
# ============================================================

brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0

# 消息保留 48 小时，凌晨 4 点清理过期文件
fileReservedTime = 48
deleteWhen = 04

brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

namesrvAddr = rmqnamesrv:9876

# 允许客户端发送不存在的 Topic 时自动创建（开发方便，生产要关掉）
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# ============================================================
# 新建 Topic 的默认队列数（M3 补写，之前是隐式的）
# ============================================================
# novel-topic 靠上面的 autoCreateTopicEnable 自动创建，创建时用这个数字。
#
# ★★ 为什么必须【显式写出来】而不是靠默认值：
#    本项目唯一的顺序消息（PROGRESS_REPORT，按 userId 分片）把用户散到这几条
#    队列上，消费者是按队列加锁顺序消费的。所以「队列数」直接决定
#      · 顺序的粒度（同一个 userId 恒定落到同一条队列 → 该用户内部有序）
#      · 队头阻塞的影响半径（一条队列卡住，只影响落在它上面的那 1/N 用户）
#    讨论顺序消息【每次都要说清队列数】—— 隐式默认值会让这个数字
#    在任何配置文件里都查不到，只能去翻 RocketMQ 的源码。
#
# ★ 4 是 RocketMQ 自己的默认值，所以这行【不改变任何现有行为】——
#   它的作用是把一个隐式事实变成显式配置。
#
# ★★ 生产上关掉上面两个 auto-create 开关之后，队列数就必须在
#    创建 Topic 时显式指定（mqadmin updateTopic -r 队列数），
#    那时这一行不再生效 —— 别以为它还能兜底。
defaultTopicQueueNums = 4

# ============================================================
# ★★★ 最容易踩的坑：brokerIP1 ★★★
#
# Broker 启动时会把自己的地址注册到 NameServer，客户端拿到这个地址后
# 直接去连它。如果不配这一项，Broker 会把【容器内网 IP】（172.x.x.x）
# 注册上去，你的 Windows 电脑根本连不到这个 IP，
# 报错长这样：
#     org.apache.rocketmq.remoting.exception.RemotingConnectException:
#     connect to 172.17.0.3:10911 failed
#
# 必须填【虚拟机的局域网 IP】，也就是 `hostname -I` 里那个 192.168.x.x。
# ★ 它和 .env 里的 RMQ_BROKER_IP 必须保持一致（两处都要改）。
# 改完执行：sudo docker compose restart rmqbroker
# ============================================================
brokerIP1 = 192.168.127.137
listenPort = 10911
